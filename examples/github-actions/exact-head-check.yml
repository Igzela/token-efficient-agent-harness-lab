# Example consumer workflow (copy into another repository's .github/workflows/).
name: exact-head-example

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Prefer pinning to a release tag or commit of this lab repository.
      - name: Fail closed if PR head moved
        uses: Igzela/token-efficient-agent-harness-lab/actions/exact-head-check@main
        with:
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number }}
          expected-head: ${{ github.event.pull_request.head.sha }}

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-proof
          path: exact-head-proof.json
