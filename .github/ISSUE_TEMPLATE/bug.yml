name: Bug report
description: Report a bug in the local harness, SDKs, dashboard, scripts, or docs
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This project is a **local / small-team** research harness, not a cloud SaaS.
        For security vulnerabilities use [Security Advisories](https://github.com/Igzela/token-efficient-agent-harness-lab/security/advisories/new), not this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps starting from a clean clone when possible.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted logs or error text. Never paste real secrets or API keys.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Docs / README / site
        - Rust engine
        - Dashboard
        - Python SDK
        - TypeScript SDK
        - Scripts / workflows
        - Install / release path
        - Unsure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain versions
      description: rustc, bun, and/or python as relevant
      placeholder: rustc … · bun … · python …
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related commits, screenshots (no secrets), or links.
