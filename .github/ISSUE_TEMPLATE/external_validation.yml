name: External validation feedback
description: Report a clean-environment install, demo, or docs dry-run without writing code
title: "[validation] "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when you tried the public path (clone, docs, install, demo, or `./scripts/external_validation.sh`) and hit a snag.
        You do **not** need to open a fix PR. Tell us the first place you got stuck.
        Do not paste secrets, API keys, tokens, or unredacted private logs.
  - type: input
    id: path
    attributes:
      label: Path you tried
      description: e.g. ./scripts/external_validation.sh, README Quick Start, cargo install, site instructions
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 clean VM, macOS 15
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Dependency versions
      description: rustc/cargo, bun, uv/python, git (as applicable)
      placeholder: e.g. rustc 1.8x, bun 1.x, uv 0.x, Python 3.11
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Exact commit (40-hex SHA)
      description: Output of `git rev-parse HEAD` on the tree you tested
      placeholder: e.g. 45e0c33aefc1870442934e17d491950f86387c7e
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command executed
      description: Exact command line (no secrets)
      placeholder: ./scripts/external_validation.sh --report /tmp/report.json
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: First failed step
      description: First stage or error that blocked success (sanitized).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Redact secrets, tokens, home paths, and private data. Prefer the machine-readable report status/reason fields.
  - type: dropdown
    id: time
    attributes:
      label: Time to first success or give-up
      options:
        - Under 5 minutes
        - 5–15 minutes
        - 15–30 minutes
        - Over 30 minutes
        - Did not succeed
    validations:
      required: true
  - type: dropdown
    id: cleanup
    attributes:
      label: Cleanup result
      description: Background processes or leftover demo state?
      options:
        - Clean (no leftover process or .acp-demo-state)
        - Leftover state or process (describe in logs)
        - Not checked
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What worked
      description: Optional. Commands or pages that were clear.
  - type: checkboxes
    id: followup
    attributes:
      label: Follow-up
      options:
        - label: I am willing to re-test after a docs fix
        - label: I may open a small PR if the fix is docs-only
