name: probe-main-push-run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/ci-main-docs-lane-acceptance-1'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact main push run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: faac83ac7bcdf60460a966f7483b7e719d4fc1a1
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_SHA']
          query = urllib.parse.urlencode({
              'event': 'push',
              'branch': 'main',
              'head_sha': target,
              'per_page': 10,
          })
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?{query}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              data = json.load(response)
          runs = [
              {
                  'id': run['id'],
                  'name': run['name'],
                  'run_number': run['run_number'],
                  'head_sha': run['head_sha'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
              }
              for run in data.get('workflow_runs', [])
              if run.get('head_sha') == target and run.get('event') == 'push'
          ]
          if len(runs) != 1:
              raise SystemExit(f'expected one exact push run, got {len(runs)}: {runs}')
          with open('/tmp/main-push-run.json', 'w', encoding='utf-8') as handle:
              json.dump(runs[0], handle, sort_keys=True)
          print(json.dumps(runs[0], sort_keys=True))
          PY
      - name: Upload exact run identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-push-run-faac83ac-${{ github.run_id }}
          path: /tmp/main-push-run.json
          retention-days: 1
          if-no-files-found: error
