name: pe2-format-helper

on:
  pull_request:
    paths:
      - "engine/src/budget_manager.rs"
      - ".github/workflows/pe2-format-helper.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Format Rust source
        run: cargo fmt --all
      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pe2-formatted-budget-manager
          path: engine/src/budget_manager.rs
          retention-days: 1
