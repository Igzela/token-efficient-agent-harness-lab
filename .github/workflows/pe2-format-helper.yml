name: pe2-format-helper

on:
  pull_request:
    paths:
      - "engine/src/budget_manager.rs"
      - ".github/workflows/pe2-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Format and commit branch-only source
        run: |
          cargo fmt --all
          if git diff --quiet -- engine/src/budget_manager.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/budget_manager.rs
          git commit -m "style: format PE-2 budget evidence contract"
          git push origin HEAD:${{ github.head_ref }}
