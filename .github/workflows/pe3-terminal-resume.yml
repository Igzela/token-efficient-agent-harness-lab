name: pe3-terminal-resume

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Apply terminal resume repair and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          queue = Path('engine/src/storage/local_product_store/operator_decision_queue/mod.rs')
          text = queue.read_text()
          start_marker = '                let budget_decision = pause_reason.strip_prefix("budget_auto_pause:");\n'
          end_marker = '            } else if status == "blocked" {\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('terminal resume source boundaries missing')
          replacement = '''                let budget_decision = pause_reason.strip_prefix("budget_auto_pause:");
                  let terminal = matches!(status, "failed" | "completed" | "cancelled");
                  let (kind, source_id, active_reason, terminal_reason, evidence_references) =
                      if let Some(decision_id) = budget_decision {
                          (
                              OperatorDecisionSourceKind::Recovery,
                              decision_id.to_string(),
                              "budget_pause_recovery_required",
                              "budget_pause_terminal",
                              vec![original_reference(
                                  "budget_pause_decision",
                                  decision_id,
                                  None,
                              )],
                          )
                      } else {
                          (
                              OperatorDecisionSourceKind::Workflow,
                              format!("workflow-pause-{run_id}"),
                              "workflow_paused",
                              "workflow_pause_terminal",
                              vec![workflow_ref.clone()],
                          )
                      };
                  push_source(
                      sources,
                      SourceInput {
                          kind,
                          id: source_id,
                          resource: run_id.clone(),
                          conflict_key: format!("{run_id}:control"),
                          action: OperatorDecisionAction::Resume,
                          state: if terminal {
                              OperatorDecisionSourceState::Resolved
                          } else {
                              OperatorDecisionSourceState::Actionable
                          },
                          severity: if terminal {
                              OperatorDecisionSeverity::Info
                          } else {
                              OperatorDecisionSeverity::Warning
                          },
                          confidence: 1.0,
                          observed_at,
                          expires_at: None,
                          reason: if terminal { terminal_reason } else { active_reason },
                          evidence_references,
                      },
                  )?;
'''
          queue.write_text(text[:start] + replacement + text[end:])

          tests = Path('engine/tests/test_pe3_operator_action_repair.rs')
          test_text = tests.read_text()
          if 'fn terminal_paused_runs_do_not_recommend_resume()' not in test_text:
              test_text += r'''

          #[test]
          fn terminal_paused_runs_do_not_recommend_resume() {
              let directory = tempdir().unwrap();
              let path = directory.path().join("local.db");
              let (store, _clock) = make_store(&path, "2026-07-11T00:00:00Z");
              for status in ["failed", "completed", "cancelled"] {
                  let run = create_run(&store, status, json!([]), json!([]));
                  let connection = rusqlite::Connection::open(&path).unwrap();
                  connection
                      .execute(
                          "UPDATE workflow_runs SET status = ?1, pause_reason = 'manual', updated_at = ?2 WHERE run_id = ?3",
                          rusqlite::params![status, "2026-07-11T00:00:00Z", run],
                      )
                      .unwrap();
              }
              let queue = store
                  .operator_decision_queue("2026-07-11T00:00:00Z", 300, 100, 0)
                  .unwrap();
              assert!(queue.items.iter().all(|item| {
                  item.recommended_action != Some(OperatorDecisionAction::Resume)
              }));
          }
          '''
          if 'fn inspect_and_acknowledge_are_explicitly_rejected()' not in test_text:
              test_text += r'''

          #[tokio::test]
          async fn inspect_and_acknowledge_are_explicitly_rejected() {
              let (_directory, _path, app, queue, item) =
                  approval_fixture("2026-07-11T00:00:00Z", "2026-07-11T00:00:10Z");
              for action in [
                  OperatorDecisionAction::Inspect,
                  OperatorDecisionAction::Acknowledge,
              ] {
                  let (status, body) = post_action(
                      app.clone(),
                      &item.decision_id,
                      action_body(&queue, action, &queue.generated_at),
                  )
                  .await;
                  assert_eq!(status, StatusCode::CONFLICT);
                  assert_eq!(
                      body["code"],
                      "operator_decision_action_not_allowlisted"
                  );
              }
          }
          '''
          tests.write_text(test_text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/storage/local_product_store/operator_decision_queue/mod.rs \
                  engine/tests/test_pe3_operator_action_repair.rs
          git commit -m "PE3-REPAIR-1 suppress terminal resume and cover unsupported actions"
          git push origin HEAD:${{ github.head_ref }}
