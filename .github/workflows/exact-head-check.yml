name: exact-head-check

# Re-read the live PR head from trusted base-branch action code on every candidate event.
# Pins follow repository Action pin policy.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: exact-head-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base action source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Verify live PR head matches expected SHA
        uses: ./trusted-base/actions/exact-head-check
        with:
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number }}
          expected-head: ${{ github.event.pull_request.head.sha }}
          allow-fork-head: "true"
          require-review-receipt: ${{ github.event.action == 'ready_for_review' && 'true' || 'false' }}
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-head-proof
          path: exact-head-proof.json
          if-no-files-found: warn
