name: diagnose-pr302-pg

on:
  push:
    branches: [docs-unified-entrypoint-1]

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.sha }}
  ACP_TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
  CARGO_INCREMENTAL: "0"

jobs:
  diagnose-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-rust-deps-2026-07-10-${{ hashFiles('Cargo.lock') }}
      - name: Run PostgreSQL integration tests and capture full log
        id: pg
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo test -p engine --features pg-tests -- --test-threads=1 2>&1 | tee /tmp/pr302-pg.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture PostgreSQL service logs
        if: always()
        run: docker logs "${{ job.services.postgres.id }}" > /tmp/pr302-postgres.log 2>&1 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr302-pg-diagnostics-${{ github.run_id }}
          path: |
            /tmp/pr302-pg.log
            /tmp/pr302-postgres.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: always()
        env:
          STATUS: ${{ steps.pg.outputs.status }}
        run: test "$STATUS" = "0"
