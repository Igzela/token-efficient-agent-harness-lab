name: agent-ci-monitor

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      emergency_stopped: ${{ steps.check.outputs.emergency_stopped }}
    steps:
      - name: Check orchestrator gate and emergency stop
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. CI monitoring disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "Emergency stop is active. CI monitoring disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "emergency_stopped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "emergency_stopped=false" >> "$GITHUB_OUTPUT"

  process:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Process CI completion
        id: ci
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          RESULT=$(python3 scripts/agent-control/ci_handler.py 2>&1)
          echo "$RESULT"
          echo "result<<REOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "REOF" >> "$GITHUB_OUTPUT"

      - name: Handle blocked
        if: fromJson(steps.ci.outputs.result).action == 'blocked'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          python3 scripts/agent-control/state_manager.py set-labels "$ISSUE" agent-blocked
          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: CI Repair Limit Exceeded
          PR: #$PR
          The CI repair limit was reached without achieving green CI.
          This task has been marked \`agent-blocked\`."

      - name: Dispatch CI repair
        if: fromJson(steps.ci.outputs.result).action == 'trigger_repair'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          SHA=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")
          RUN_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['ci_run_id'])")
          FAILED=$(echo "$RESULT" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin)['failed_jobs']))")
          REPAIR_COUNT=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['repair_count'])")
          LOGS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('logs',''))")

          gh workflow run agent-ci-repair.yml \
            --ref main \
            -f pr_number="$PR" \
            -f issue_number="$ISSUE" \
            -f head_sha="$SHA" \
            -f failed_jobs="$FAILED" \
            -f repair_count="$REPAIR_COUNT" \
            -f ci_run_id="$RUN_ID" \
            -f failed_logs="$LOGS"

      - name: Dispatch review
        if: fromJson(steps.ci.outputs.result).action == 'trigger_review'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          SHA=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")

          gh workflow run agent-review.yml \
            --ref main \
            -f pr_number="$PR" \
            -f issue_number="$ISSUE" \
            -f head_sha="$SHA"

      - name: Dispatch merge
        if: fromJson(steps.ci.outputs.result).action == 'merge_ready'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          SHA=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")

          if [ "${AGENT_AUTO_MERGE_ENABLED:-false}" != "true" ]; then
            echo "AGENT_AUTO_MERGE_ENABLED is not true. Merge not dispatched."
            python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
              "## Agent Orchestrator: Merge Ready (Auto-Merge Disabled)
            PR: #$PR
            All CI checks passed and review is complete. Auto-merge is disabled.
            Set AGENT_AUTO_MERGE_ENABLED=true to enable automatic merging."
            exit 0
          fi

          gh workflow run agent-merge.yml \
            --ref main \
            -f pr_number="$PR" \
            -f issue_number="$ISSUE" \
            -f head_sha="$SHA"
        env:
          AGENT_AUTO_MERGE_ENABLED: ${{ vars.AGENT_AUTO_MERGE_ENABLED }}
