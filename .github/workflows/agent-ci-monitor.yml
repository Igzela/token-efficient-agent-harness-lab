name: agent-ci-monitor

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-ci-monitor
  cancel-in-progress: false

env:
  AGENT_REPO: ${{ github.repository }}
  AGENT_GH_CMD: gh

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Process CI completion
        id: ci
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          RESULT=$(python3 ${{ github.workspace }}/scripts/agent-control/ci_handler.py 2>&1)
          echo "$RESULT"
          echo "result<<REOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "REOF" >> "$GITHUB_OUTPUT"

      - name: Handle blocked
        if: fromJson(steps.ci.outputs.result).action == 'blocked'
        run: |
          ISSUE=$(echo '${{ steps.ci.outputs.result }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          PR=$(echo '${{ steps.ci.outputs.result }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels "$ISSUE" agent-blocked
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: CI Repair Limit Exceeded

          PR: #${PR}

          The CI repair limit was reached without achieving green CI.

          This task has been marked \`agent-blocked\`. Manual intervention is required."

      - name: Dispatch CI repair
        if: fromJson(steps.ci.outputs.result).action == 'trigger_repair'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          SHA=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")
          RUN_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['ci_run_id'])")
          FAILED=$(echo "$RESULT" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin)['failed_jobs']))")
          REPAIR_COUNT=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['repair_count'])")
          LOGS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('logs',''))" | head -c 50000)

          gh workflow run agent-ci-repair.yml \
            --ref ${{ github.ref_name }} \
            -f pr_number="$PR" \
            -f issue_number="$ISSUE" \
            -f head_sha="$SHA" \
            -f failed_jobs="$FAILED" \
            -f repair_count="$REPAIR_COUNT" \
            -f ci_run_id="$RUN_ID"

      - name: Dispatch review
        if: fromJson(steps.ci.outputs.result).action == 'trigger_review'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          SHA=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")

          gh workflow run agent-review.yml \
            --ref ${{ github.ref_name }} \
            -f pr_number="$PR" \
            -f issue_number="$ISSUE" \
            -f head_sha="$SHA"

      - name: Dispatch merge
        if: fromJson(steps.ci.outputs.result).action == 'merge_ready'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          PR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['pr_number'])")
          ISSUE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['issue_number'])")
          SHA=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")

          gh workflow run agent-merge.yml \
            --ref ${{ github.ref_name }} \
            -f pr_number="$PR" \
            -f issue_number="$ISSUE" \
            -f head_sha="$SHA"
