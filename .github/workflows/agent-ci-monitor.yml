name: agent-ci-monitor

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number bound to the PR
        required: true
        type: number
      pr:
        description: PR number with completed CI
        required: true
        type: number
      head_sha:
        description: Exact head SHA of the PR and CI run
        required: true
        type: string
      ci_run_id:
        description: Exact canonical tests workflow run ID
        required: true
        type: number

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-ci-monitor-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Exit without mutation when controls are disabled or emergency-stopped
        id: gate
        run: |
          if python3 scripts/agent-control/control_state.py require-live >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Process exact canonical workflow_run evidence or explicit dispatch
        id: decision
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/agent-control/ci_handler.py process-dispatch \
              "${{ inputs.issue }}" "${{ inputs.pr }}" \
              "${{ inputs.head_sha }}" "${{ inputs.ci_run_id }}" \
              > "$RUNNER_TEMP/ci-decision.json"
            python3 scripts/agent-control/ci_handler.py validate-decision \
              "$RUNNER_TEMP/ci-decision.json" >/dev/null
          else
            python3 scripts/agent-control/ci_handler.py > "$RUNNER_TEMP/ci-decision.json"
          fi
          cat "$RUNNER_TEMP/ci-decision.json"
          echo "action=$(jq -er '.action' "$RUNNER_TEMP/ci-decision.json")" >> "$GITHUB_OUTPUT"
          for key in pr_number issue_number head_sha ci_run_id repair_count terminal_status observed_status reason; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' "$RUNNER_TEMP/ci-decision.json")
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Release and record stale or control-stopped terminal outcome
        if: (steps.decision.outputs.action == 'stale' || steps.decision.outputs.terminal_status != '') && steps.decision.outputs.action != 'noop'
        env:
          ISSUE_NUMBER: ${{ steps.decision.outputs.issue_number }}
          PR_NUMBER: ${{ steps.decision.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          CI_RUN_ID: ${{ steps.decision.outputs.ci_run_id }}
          TERMINAL_STATUS: ${{ steps.decision.outputs.terminal_status }}
          OBSERVED_STATUS: ${{ steps.decision.outputs.observed_status }}
          TERMINAL_REASON: ${{ steps.decision.outputs.reason }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/state_manager.py release-ci-terminal \
            "$ISSUE_NUMBER" "$PR_NUMBER" "$HEAD_SHA" "$CI_RUN_ID" \
            "$TERMINAL_STATUS" "$TERMINAL_REASON" "$OBSERVED_STATUS"
      - name: Dispatch bounded CI repair by exact failed run ID
        id: dispatch_repair
        if: steps.decision.outputs.terminal_status == '' && steps.decision.outputs.action == 'trigger_repair'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          set +e
          result=$(python3 scripts/agent-control/dispatcher.py dispatch-repair \
            "${{ steps.decision.outputs.pr_number }}" \
            "${{ steps.decision.outputs.issue_number }}" \
            "${{ steps.decision.outputs.head_sha }}" \
            "${{ steps.decision.outputs.ci_run_id }}" \
            "${{ steps.decision.outputs.repair_count }}")
          status=$?
          set -e
          printf '%s\n' "$result"
          retained=$(printf '%s' "$result" | jq -r '.reason == "dispatch_state_failed_capacity_retained" or .reason == "dispatch_in_flight" or .reason == "capacity_already_claimed" or .reason == "capacity_already_claimed_unverified"' 2>/dev/null || true)
          echo "capacity_retained=${retained:-false}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Dispatch independent exact-head review
        id: dispatch_review
        if: steps.decision.outputs.terminal_status == '' && steps.decision.outputs.action == 'trigger_review'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          set +e
          result=$(python3 scripts/agent-control/dispatcher.py dispatch-review \
            "${{ steps.decision.outputs.pr_number }}" \
            "${{ steps.decision.outputs.issue_number }}" \
            "${{ steps.decision.outputs.head_sha }}")
          status=$?
          set -e
          printf '%s\n' "$result"
          retained=$(printf '%s' "$result" | jq -r '.reason == "dispatch_state_failed_capacity_retained" or .reason == "dispatch_in_flight" or .reason == "capacity_already_claimed" or .reason == "capacity_already_claimed_unverified"' 2>/dev/null || true)
          echo "capacity_retained=${retained:-false}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Record control stop during follow-up handoff
        if: always() && steps.decision.outputs.terminal_status == '' && (steps.decision.outputs.action == 'trigger_repair' || steps.decision.outputs.action == 'trigger_review')
        env:
          ISSUE_NUMBER: ${{ steps.decision.outputs.issue_number }}
          PR_NUMBER: ${{ steps.decision.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          CI_RUN_ID: ${{ steps.decision.outputs.ci_run_id }}
          ACTION: ${{ steps.decision.outputs.action }}
          OBSERVED_STATUS: ${{ steps.decision.outputs.observed_status }}
          REPAIR_OUTCOME: ${{ steps.dispatch_repair.outcome }}
          REPAIR_CAPACITY_RETAINED: ${{ steps.dispatch_repair.outputs.capacity_retained }}
          REVIEW_OUTCOME: ${{ steps.dispatch_review.outcome }}
          REVIEW_CAPACITY_RETAINED: ${{ steps.dispatch_review.outputs.capacity_retained }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "trigger_repair" ]; then
            DISPATCH_ID="repair:${PR_NUMBER}:${HEAD_SHA}:${CI_RUN_ID}:${{ steps.decision.outputs.repair_count }}"
          else
            DISPATCH_ID="review:${PR_NUMBER}:${HEAD_SHA}"
          fi
          set +e
          CLAIM_OUTCOME=$(python3 scripts/agent-control/state_manager.py reconcile-dispatch \
            "$ISSUE_NUMBER" "$DISPATCH_ID" "workflow_cancelled:followup_dispatch" 2>&1)
          CLAIM_STATUS=$?
          set -e
          if [ "$CLAIM_STATUS" -eq 0 ] && [ "$CLAIM_OUTCOME" = "dispatched_in_flight" ]; then
            exit 0
          fi
          if [ "$CLAIM_STATUS" -eq 0 ] && [ "$CLAIM_OUTCOME" = "released" ]; then
            exit 0
          fi
          if python3 scripts/agent-control/control_state.py require-live >/dev/null; then
            if [ "$ACTION" = "trigger_repair" ]; then
              if [ "$REPAIR_OUTCOME" = "success" ] || [ "$REPAIR_CAPACITY_RETAINED" = "true" ]; then
                exit 0
              fi
            else
              if [ "$REVIEW_OUTCOME" = "success" ] || [ "$REVIEW_CAPACITY_RETAINED" = "true" ]; then
                exit 0
              fi
            fi
            python3 scripts/agent-control/state_manager.py release-ci-terminal \
              "$ISSUE_NUMBER" "$PR_NUMBER" "$HEAD_SHA" "$CI_RUN_ID" \
              terminal_ci_followup_dispatch_failed \
              "ci_followup_dispatch_failed:$ACTION" "$OBSERVED_STATUS"
            exit 0
          fi
          python3 scripts/agent-control/state_manager.py release-ci-terminal \
            "$ISSUE_NUMBER" "$PR_NUMBER" "$HEAD_SHA" "$CI_RUN_ID" \
            terminal_ci_control_stopped ci_control_stopped:before_followup_dispatch "$OBSERVED_STATUS"
      - name: Reconcile a cancelled follow-up dispatch claim
        id: reconcile_claim
        if: always() && steps.decision.outputs.terminal_status == '' && (steps.decision.outputs.action == 'trigger_repair' || steps.decision.outputs.action == 'trigger_review')
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ steps.decision.outputs.issue_number }}
          PR_NUMBER: ${{ steps.decision.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          CI_RUN_ID: ${{ steps.decision.outputs.ci_run_id }}
          REPAIR_COUNT: ${{ steps.decision.outputs.repair_count }}
          ACTION: ${{ steps.decision.outputs.action }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "trigger_repair" ]; then
            DISPATCH_ID="repair:${PR_NUMBER}:${HEAD_SHA}:${CI_RUN_ID}:${REPAIR_COUNT}"
          else
            DISPATCH_ID="review:${PR_NUMBER}:${HEAD_SHA}"
          fi
          set +e
          OUTCOME=$(python3 scripts/agent-control/state_manager.py reconcile-dispatch \
            "$ISSUE_NUMBER" "$DISPATCH_ID" "workflow_cancelled:followup_dispatch" 2>&1)
          STATUS=$?
          set -e
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            printf '%s\n' "$OUTCOME"
            exit "$STATUS"
          fi
          printf '%s\n' "$OUTCOME"
      - name: Dispatch merge only through the auto-merge control gate
        id: dispatch_merge
        if: steps.decision.outputs.terminal_status == '' && steps.decision.outputs.action == 'merge_ready'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-auto-merge >/dev/null
          set +e
          result=$(python3 scripts/agent-control/dispatcher.py dispatch-merge \
            "${{ steps.decision.outputs.pr_number }}" \
            "${{ steps.decision.outputs.issue_number }}" \
            "${{ steps.decision.outputs.head_sha }}")
          status=$?
          set -e
          printf '%s\n' "$result"
          retained=$(printf '%s' "$result" | jq -r '.reason == "dispatch_state_failed_capacity_retained" or .reason == "dispatch_in_flight" or .reason == "capacity_already_claimed" or .reason == "capacity_already_claimed_unverified"' 2>/dev/null || true)
          echo "capacity_retained=${retained:-false}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Record merge handoff failure or control stop
        if: always() && steps.decision.outputs.terminal_status == '' && steps.decision.outputs.action == 'merge_ready'
        env:
          ISSUE_NUMBER: ${{ steps.decision.outputs.issue_number }}
          PR_NUMBER: ${{ steps.decision.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          CI_RUN_ID: ${{ steps.decision.outputs.ci_run_id }}
          OBSERVED_STATUS: ${{ steps.decision.outputs.observed_status }}
          MERGE_OUTCOME: ${{ steps.dispatch_merge.outcome }}
          MERGE_CAPACITY_RETAINED: ${{ steps.dispatch_merge.outputs.capacity_retained }}
        run: |
          set -euo pipefail
          if python3 scripts/agent-control/control_state.py require-live >/dev/null; then
            if [ "$MERGE_OUTCOME" = "success" ] || [ "$MERGE_CAPACITY_RETAINED" = "true" ]; then
              exit 0
            fi
            python3 scripts/agent-control/state_manager.py release-ci-terminal \
              "$ISSUE_NUMBER" "$PR_NUMBER" "$HEAD_SHA" "$CI_RUN_ID" \
              terminal_ci_merge_dispatch_failed \
              ci_merge_dispatch_failed:merge_ready "$OBSERVED_STATUS"
            exit 0
          fi
          python3 scripts/agent-control/state_manager.py release-ci-terminal \
            "$ISSUE_NUMBER" "$PR_NUMBER" "$HEAD_SHA" "$CI_RUN_ID" \
            terminal_ci_control_stopped ci_control_stopped:before_merge_dispatch "$OBSERVED_STATUS"
      - name: Release the exact-head CI failure's active capacity
        if: steps.decision.outputs.terminal_status == '' && steps.decision.outputs.action == 'blocked'
        run: |
          python3 scripts/agent-control/state_manager.py release-failed \
            "${{ steps.decision.outputs.issue_number }}" any agent-blocked \
            "${{ steps.decision.outputs.head_sha }}" "" "" \
            "${{ steps.decision.outputs.pr_number }}" \
            "${{ steps.decision.outputs.ci_run_id }}"
      - name: Consume bound no-op decision and release its active capacity
        if: steps.decision.outputs.action == 'noop' && steps.decision.outputs.terminal_status != ''
        env:
          ISSUE_NUMBER: ${{ steps.decision.outputs.issue_number }}
          PR_NUMBER: ${{ steps.decision.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          CI_RUN_ID: ${{ steps.decision.outputs.ci_run_id }}
          TERMINAL_STATUS: ${{ steps.decision.outputs.terminal_status }}
          OBSERVED_STATUS: ${{ steps.decision.outputs.observed_status }}
          NOOP_REASON: ${{ steps.decision.outputs.reason }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/state_manager.py release-ci-terminal \
            "$ISSUE_NUMBER" "$PR_NUMBER" "$HEAD_SHA" "$CI_RUN_ID" \
            "$TERMINAL_STATUS" "$NOOP_REASON" "$OBSERVED_STATUS"
      - name: Consume unbound no-op decision and release matching capacity
        if: steps.decision.outputs.action == 'noop' && steps.decision.outputs.terminal_status == '' && steps.decision.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.decision.outputs.issue_number }}
          PR_NUMBER: ${{ steps.decision.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          NOOP_REASON: ${{ steps.decision.outputs.reason }}
        run: |
          set -euo pipefail
          test -n "$ISSUE_NUMBER"
          test -n "$PR_NUMBER"
          test -n "$HEAD_SHA"
          echo "Releasing matching capacity for unbound no-op: $NOOP_REASON"
          python3 scripts/agent-control/state_manager.py release-failed \
            "$ISSUE_NUMBER" any agent-blocked "$HEAD_SHA" "" "" "$PR_NUMBER"
      - name: End unbound external-event no-op without mutation
        if: steps.decision.outputs.action == 'noop' && steps.decision.outputs.terminal_status == '' && steps.decision.outputs.issue_number == ''
        run: |
          echo "No owned Issue/PR/head binding; no capacity mutation permitted"
