name: agent-ci-monitor

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check orchestrator gate and emergency stop
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  process:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Process exact CI completion
        id: ci
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/agent-control/ci_handler.py)
          echo "$RESULT"
          {
            echo "result<<REOF"
            echo "$RESULT"
            echo "REOF"
          } >> "$GITHUB_OUTPUT"

      - name: Handle blocked repair limit
        if: fromJson(steps.ci.outputs.result).action == 'blocked'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          ISSUE=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["issue_number"])' "$RESULT")
          PR=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["pr_number"])' "$RESULT")
          python3 scripts/agent-control/state_manager.py set-labels "$ISSUE" agent-blocked
          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: CI Repair Limit Exceeded\nPR: #$PR\nNo further automatic repair is allowed."

      - name: Dispatch CI repair through global controller
        if: fromJson(steps.ci.outputs.result).action == 'trigger_repair'
        run: |
          set -euo pipefail
          RESULT='${{ steps.ci.outputs.result }}'
          readarray -t VALUES < <(python3 - "$RESULT" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          print(value["pr_number"])
          print(value["issue_number"])
          print(value["head_sha"])
          print(value["ci_run_id"])
          print(value["repair_count"])
          print(json.dumps(value["failed_jobs"], separators=(",", ":")))
          PY
          )
          gh workflow run agent-controller.yml --ref main \
            -f command=dispatch-repair \
            -f pr_number="${VALUES[0]}" \
            -f issue="${VALUES[1]}" \
            -f head_sha="${VALUES[2]}" \
            -f ci_run_id="${VALUES[3]}" \
            -f repair_count="${VALUES[4]}" \
            -f failed_jobs="${VALUES[5]}"

      - name: Dispatch review through global controller
        if: fromJson(steps.ci.outputs.result).action == 'trigger_review'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          readarray -t VALUES < <(python3 - "$RESULT" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          print(value["pr_number"])
          print(value["issue_number"])
          print(value["head_sha"])
          PY
          )
          gh workflow run agent-controller.yml --ref main \
            -f command=dispatch-review \
            -f pr_number="${VALUES[0]}" \
            -f issue="${VALUES[1]}" \
            -f head_sha="${VALUES[2]}"

      - name: Dispatch merge through global controller
        if: fromJson(steps.ci.outputs.result).action == 'merge_ready'
        run: |
          RESULT='${{ steps.ci.outputs.result }}'
          readarray -t VALUES < <(python3 - "$RESULT" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          print(value["pr_number"])
          print(value["issue_number"])
          print(value["head_sha"])
          PY
          )
          if [ "${{ vars.AGENT_AUTO_MERGE_ENABLED }}" != "true" ]; then
            echo "AGENT_AUTO_MERGE_ENABLED is not true; merge remains disabled."
            exit 0
          fi
          gh workflow run agent-controller.yml --ref main \
            -f command=dispatch-merge \
            -f pr_number="${VALUES[0]}" \
            -f issue="${VALUES[1]}" \
            -f head_sha="${VALUES[2]}"
