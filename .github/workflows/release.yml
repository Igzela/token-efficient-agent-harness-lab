name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: agent-control-plane
  PACKAGE_PREFIX: agent-control-plane
  ACP_PREVIOUS_KNOWN_GOOD: ${{ vars.ACP_PREVIOUS_KNOWN_GOOD }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      ACP_TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Verify Rust and TypeScript stack
        run: bash scripts/verify_rust_typescript_stack.sh
      - name: Verify PostgreSQL integration
        run: cargo test -p engine --features pg-tests -- --test-threads=1
      - name: Verify Python SDK
        run: cd sdk/python && PYTHONPATH=src uv run --no-project python -m unittest discover -s tests
      - name: Verify dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
          cd dashboard
          bun audit
          cd ../sdk/typescript
          bun audit
      - name: Verify release contract and agent handoff
        run: |
          bash scripts/check_github_action_pins.sh
          bash scripts/check_release_contract.sh
          PYTHONPATH=. uv run --no-project python -m unittest tools.test_release_provenance
          uv run --no-project python scripts/check_agent_handoff.py

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build static dashboard
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build:static

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p engine --target ${{ matrix.target }}
          else
            cargo build --release -p engine --target ${{ matrix.target }}
          fi

      - name: Assemble tarball
        id: tarball
        run: |
          PACKAGE="${{ env.PACKAGE_PREFIX }}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          TARBALL="${PACKAGE}.tar.gz"
          STAGING=$(mktemp -d)
          PACKAGE_DIR="$STAGING/$PACKAGE"
          mkdir -p "$PACKAGE_DIR/dashboard"

          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$PACKAGE_DIR/engine"
          cp -r dashboard/out/. "$PACKAGE_DIR/dashboard/"
          cp .env.example "$PACKAGE_DIR/"
          cp README.md "$PACKAGE_DIR/"
          cp scripts/install.sh scripts/upgrade.sh scripts/release_provenance.py "$PACKAGE_DIR/"
          chmod +x "$PACKAGE_DIR/engine" "$PACKAGE_DIR/install.sh" "$PACKAGE_DIR/upgrade.sh"
          tar -czf "$TARBALL" -C "$STAGING" "$PACKAGE"

          # Generate checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$TARBALL" > "${TARBALL}.sha256"
          else
            shasum -a 256 "$TARBALL" > "${TARBALL}.sha256"
          fi

          case "${{ matrix.target }}" in
            *-unknown-linux-gnu) TARGET_OS="linux" ;;
            *-apple-darwin) TARGET_OS="macos" ;;
            *) echo "unsupported release target" >&2; exit 1 ;;
          esac
          TARGET_ARCH="${{ matrix.target }}"
          TARGET_ARCH="${TARGET_ARCH%%-*}"
          METADATA="${PACKAGE}.metadata.json"
          SBOM="${TARBALL}.spdx.json"
          ATTESTATION="${TARBALL}.attestation.json"
          PROVENANCE="${TARBALL}.provenance.json"
          python3 scripts/release_provenance.py write-metadata \
            --root "$GITHUB_WORKSPACE" \
            --output "$METADATA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --workflow ".github/workflows/release.yml" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "build-${{ matrix.target }}" \
            --builder-id "github-hosted:${RUNNER_OS}" \
            --target-os "$TARGET_OS" \
            --target-architecture "$TARGET_ARCH" \
            --target-triple "${{ matrix.target }}" \
            --package-kind "package" \
            --artifact-name "$TARBALL" \
            --artifact-media-type "application/vnd.acp.release+tar" \
            --previous-known-good "${ACP_PREVIOUS_KNOWN_GOOD:-unknown}" \
            --rollback-target "${ACP_PREVIOUS_KNOWN_GOOD:-unknown}" \
            --publication-mode "github-release" \
            --lockfile "Cargo.lock" \
            --lockfile "dashboard/bun.lock" \
            --lockfile "sdk/typescript/bun.lock" \
            --build-input "engine/Cargo.toml" \
            --build-input ".env.example" \
            --build-input "dashboard/package.json"
          python3 scripts/release_provenance.py create-sbom \
            --metadata "$METADATA" \
            --artifact "$TARBALL" \
            --output "$SBOM"

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "metadata=$METADATA" >> "$GITHUB_OUTPUT"
          echo "sbom=$SBOM" >> "$GITHUB_OUTPUT"
          echo "attestation=$ATTESTATION" >> "$GITHUB_OUTPUT"
          echo "provenance=$PROVENANCE" >> "$GITHUB_OUTPUT"

      - name: Generate external artifact and SBOM attestation
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.tarball.outputs.tarball }}
          sbom-path: ${{ steps.tarball.outputs.sbom }}

      - name: Bind attestation to release provenance
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.tarball.outputs.attestation }}"
          python3 scripts/release_provenance.py create-provenance \
            --metadata "${{ steps.tarball.outputs.metadata }}" \
            --artifact "${{ steps.tarball.outputs.tarball }}" \
            --sbom "${{ steps.tarball.outputs.sbom }}" \
            --attestation "${{ steps.tarball.outputs.attestation }}" \
            --output "${{ steps.tarball.outputs.provenance }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.tarball.outputs.tarball }}
            ${{ steps.tarball.outputs.tarball }}.sha256
            ${{ steps.tarball.outputs.metadata }}
            ${{ steps.tarball.outputs.sbom }}
            ${{ steps.tarball.outputs.attestation }}
            ${{ steps.tarball.outputs.provenance }}
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name "*.tar.gz" -o -name "*.sha256" -o -name "*.metadata.json" \
            -o -name "*.spdx.json" -o -name "*.attestation.json" \
            -o -name "*.provenance.json" \
          \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Verify release identity, head, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          provenances=(release-assets/*.provenance.json)
          test "${#provenances[@]}" -gt 0
          for provenance in "${provenances[@]}"; do
            base="${provenance%.provenance.json}"
            artifact="${base}"
            sbom="${base}.spdx.json"
            attestation="${base}.attestation.json"
            external="${base}.external-verification.json"
            external_provenance="${base}.external-provenance.json"
            external_sbom="${base}.external-sbom.json"
            verification="${base}.verification.json"
            test -f "$artifact"
            test -f "$sbom"
            test -f "$attestation"
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners \
              --format json > "$external_provenance"
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners \
              --predicate-type "https://spdx.dev/Document/v2.3" \
              --format json > "$external_sbom"
            jq -s '{provenance: .[0], sbom: .[1]}' \
              "$external_provenance" "$external_sbom" > "$external"
            python3 scripts/release_provenance.py verify \
              --artifact "$artifact" \
              --sbom "$sbom" \
              --attestation "$attestation" \
              --provenance "$provenance" \
              --mode production \
              --external-verification "$external" \
              --output "$verification" >/dev/null
          done
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release already exists; duplicate publication is refused" >&2
            exit 1
          fi

      - name: Generate release body
        id: body
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cat > release-body.md << 'HEADER'
          # Agent Control Plane ${VERSION}

          ## Installation

          The production installer verifies the checksum, GitHub artifact
          attestation, SPDX SBOM, and provenance before activation, then uses
          the existing atomic installer/upgrader owners:

          ```bash
          VERSION=${VERSION} bash -c 'curl -fsSL https://raw.githubusercontent.com/Igzela/token-efficient-agent-harness-lab/main/scripts/install-from-release.sh | bash'
          ```

          Directly invoking `install.sh` requires passing the complete evidence
          paths and external verification result. `--development` is only for
          explicitly non-publishing local dry runs.

          ## Verify Checksums
          ```bash
          sha256sum -c agent-control-plane-${VERSION}-*.sha256
          ```

          ## Verify Provenance
          The release assets include an SPDX 2.3 SBOM, a provenance manifest,
          and the attestation evidence used by the publish gate. Consumers
          must verify the archive with GitHub's artifact-attestation verifier
          before activation.
          HEADER

          # Replace version placeholder
          sed -i "s/\${VERSION}/${VERSION}/g" release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-body.md
          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
