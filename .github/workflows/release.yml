name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: agent-control-plane
  PACKAGE_PREFIX: agent-control-plane

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build static dashboard
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build:static

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p engine --target ${{ matrix.target }}
          else
            cargo build --release -p engine --target ${{ matrix.target }}
          fi

      - name: Assemble tarball
        id: tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARBALL="${{ env.PACKAGE_PREFIX }}-${VERSION}-${{ matrix.target }}.tar.gz"
          STAGING=$(mktemp -d)

          # Copy binary
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$STAGING/"

          # Copy static dashboard assets
          cp -r dashboard/out "$STAGING/dashboard"

          # Copy .env.example
          cp .env.example "$STAGING/"

          # Create tarball
          tar -czf "$TARBALL" -C "$STAGING" .

          # Generate checksum
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.tarball.outputs.tarball }}
            ${{ steps.tarball.outputs.tarball }}.sha256
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Generate release body
        id: body
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cat > release-body.md << 'HEADER'
          # Agent Control Plane ${VERSION}

          ## Installation

          Download the archive for your platform, extract, and run.

          ### Linux x86_64
          ```bash
          tar -xzf agent-control-plane-${VERSION}-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin/
          agent-control-plane --help
          ```

          ### Linux aarch64
          ```bash
          tar -xzf agent-control-plane-${VERSION}-aarch64-unknown-linux-gnu.tar.gz -C /usr/local/bin/
          agent-control-plane --help
          ```

          ### macOS x86_64 (Intel)
          ```bash
          tar -xzf agent-control-plane-${VERSION}-x86_64-apple-darwin.tar.gz -C /usr/local/bin/
          agent-control-plane --help
          ```

          ### macOS aarch64 (Apple Silicon)
          ```bash
          tar -xzf agent-control-plane-${VERSION}-aarch64-apple-darwin.tar.gz -C /usr/local/bin/
          agent-control-plane --help
          ```

          ## Verify Checksums
          ```bash
          sha256sum -c agent-control-plane-${VERSION}-*.sha256
          ```
          HEADER

          # Replace version placeholder
          sed -i "s/\${VERSION}/${VERSION}/g" release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
