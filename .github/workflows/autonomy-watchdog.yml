name: autonomy-watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watch-main-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest main tests workflow
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "tests.yml",
              branch: "main",
              per_page: 1,
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed("No tests workflow run found for main");
              return;
            }
            const run = runs.data.workflow_runs[0];
            core.info(`latest main tests run id=${run.id} sha=${run.head_sha} status=${run.status} conclusion=${run.conclusion} url=${run.html_url}`);
            if (run.status !== "completed") {
              core.setFailed(`Latest main tests workflow is not completed: ${run.status}`);
              return;
            }
            if (run.conclusion !== "success") {
              core.setFailed(`Latest main tests workflow is not green: ${run.conclusion}`);
            }
