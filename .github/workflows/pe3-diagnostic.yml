name: pe3-diagnostic

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: rustfmt,clippy
      - name: Capture focused diagnostics
        continue-on-error: true
        run: |
          set +e
          {
            echo '=== cargo fmt --check ==='
            cargo fmt --all -- --check
            echo "fmt_exit=$?"
            echo '=== cargo check ==='
            cargo check -p engine --all-targets --all-features
            echo "check_exit=$?"
            echo '=== focused test compile ==='
            cargo test -p engine --test test_pe3_operator_action_repair --no-run
            echo "focused_compile_exit=$?"
          } > pe3-diagnostic.log 2>&1
          cat pe3-diagnostic.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pe3-diagnostic
          path: pe3-diagnostic.log
          retention-days: 1
