name: agent-review

env:
  INPUT_HEAD_SHA: ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-review-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Verify control, exact head, and Issue-to-PR binding
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py verify-binding "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA"
      - name: Recheck control immediately before recording review-running
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py set-labels "${{ inputs.issue_number }}" review-running
      - name: Build trusted review prompt
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/prompt_builder.py review "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA" > "$RUNNER_TEMP/review-prompt.txt"
      - name: Upload trusted review input
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Upload trusted review input artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-input-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/review-prompt.txt
          retention-days: 1
          if-no-files-found: error

  vader-review:
    needs: prepare
    runs-on: [self-hosted, vader, agent-worker]
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-input-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/review-input
      - name: Recheck control immediately before read-only Codex review
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Run Codex review in read-only sandbox with no GitHub credentials
        run: |
          bash scripts/agent-control/codex_wrapper.sh review "$RUNNER_TEMP/review-input/review-prompt.txt" \
            "$RUNNER_TEMP/codex-output" "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/review-artifact"
          cp "$RUNNER_TEMP/codex-output/codex-last-message.json" "$RUNNER_TEMP/review-artifact/review-result.json"
      - name: Recheck control immediately before review artifact upload
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Upload untrusted structured review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-result-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/review-artifact/review-result.json
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: vader-review
    if: needs.vader-review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-result-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/review-artifact
      - name: Validate full review schema and exact reviewed head
        id: verdict
        run: python3 scripts/agent-control/validate_review.py "$RUNNER_TEMP/review-artifact/review-result.json" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA"
      - name: Recheck live control and binding before recording verdict
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_SUMMARY: ${{ steps.verdict.outputs.summary }}
        run: |
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py verify-binding "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA"
          python3 scripts/agent-control/state_manager.py record-review "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA" "${{ steps.verdict.outputs.verdict }}" "$REVIEW_SUMMARY"
      - name: Authorize only exact PASS
        if: steps.verdict.outputs.verdict == 'PASS'
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py finalize-review-labels "${{ inputs.issue_number }}" PASS
          if python3 scripts/agent-control/control_state.py require-auto-merge >/dev/null; then
            python3 scripts/agent-control/dispatcher.py dispatch-merge "${{ inputs.pr_number }}" "${{ inputs.issue_number }}" "$INPUT_HEAD_SHA"
          fi
      - name: Move non-PASS verdict to operator-review state
        if: steps.verdict.outputs.verdict != 'PASS'
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py finalize-review-labels "${{ inputs.issue_number }}" "$REVIEW_VERDICT"

  failure-handler:
    needs: [prepare, vader-review, finalize]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Move only the current failed review to operator-review state
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent-control/state_manager.py release-failed \
            "${{ inputs.issue_number }}" review-running agent-review-blocked "$INPUT_HEAD_SHA"
