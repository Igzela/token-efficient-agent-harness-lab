name: agent-review

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: agent-review-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  AGENT_REPO: ${{ github.repository }}
  AGENT_GH_CMD: gh

jobs:
  review:
    runs-on: [self-hosted, vader, review]
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify head SHA
        run: |
          PR_INFO=$(gh pr view ${{ inputs.pr_number }} --json headRefOid --jq '.headRefOid')
          if [ "$PR_INFO" != "${{ inputs.head_sha }}" ]; then
            echo "ERROR: PR head SHA has changed. Expected ${{ inputs.head_sha }}, got $PR_INFO"
            exit 1
          fi
          echo "Head SHA verified: $PR_INFO"

      - name: Mark final-review
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ inputs.issue_number }} final-review

      - name: Build review prompt
        id: prompt
        run: |
          PROMPT=$(python3 ${{ github.workspace }}/scripts/agent-control/prompt_builder.py review \
            ${{ inputs.pr_number }} ${{ inputs.head_sha }})
          echo "prompt<<PEOF" >> "$GITHUB_OUTPUT"
          echo "$PROMPT" >> "$GITHUB_OUTPUT"
          echo "PEOF" >> "$GITHUB_OUTPUT"

      - name: Run Codex (review worker)
        id: codex
        env:
          CODEX_AUTH_TOKEN: ${{ secrets.CODEX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running review for PR #${{ inputs.pr_number }}..."
          
          codex exec \
            --target-dir "${{ github.workspace }}" \
            --goal "${{ steps.prompt.outputs.prompt }}" \
            --sliding-context \
            --print \
            --no-sandbox \
            2>&1 | tee /tmp/codex-review-${{ inputs.pr_number }}.log

      - name: Parse review verdict
        id: verdict
        run: |
          python3 -c "
import json, re, sys
log = open('/tmp/codex-review-${{ inputs.pr_number }}.log').read()
# Extract JSON verdict from last line
match = re.search(r'\{[^}]+\"verdict\"[^}]+\}', log, re.DOTALL)
if match:
    try:
        verdict = json.loads(match.group())
        print(f'verdict={verdict[\"verdict\"]}')
        print(f'summary={verdict.get(\"summary\",\"\")}')
        print(f'security_ok={verdict.get(\"security_ok\", False)}')
        print(f'rollback_ok={verdict.get(\"rollback_ok\", False)}')
        print(f'ci_green={verdict.get(\"ci_green\", False)}')
    except (json.JSONDecodeError, KeyError) as e:
        print(f'verdict=FAIL')
        print(f'summary=Verdict parsing failed: {e}')
" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        run: |
          VERDICT=${{ steps.verdict.outputs.verdict || 'FAIL' }}
          SUMMARY="${{ steps.verdict.outputs.summary || 'Review completed' }}"
          
          gh pr review ${{ inputs.pr_number }} \
            --body "## Agent Orchestrator: Final Review

          **Verdict:** \`${VERDICT}\`

          ${SUMMARY}

          ---
          _Review generated by agent-orchestrator_"

      - name: Handle non-pass verdicts
        if: steps.verdict.outputs.verdict != 'PASS' && steps.verdict.outputs.verdict != 'PASS_WITH_NOTES'
        run: |
          ISSUE=${{ inputs.issue_number }}
          PR=${{ inputs.pr_number }}
          VERDICT=${{ steps.verdict.outputs.verdict || 'FAIL' }}
          
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels "$ISSUE" agent-blocked
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: Review Blocked

          PR: #${PR}
          
          Final review returned **${VERDICT}**.
          
          This task has been marked \`agent-blocked\`. Manual intervention is required."
          exit 1

      - name: Handle pass verdict (trigger merge)
        if: steps.verdict.outputs.verdict == 'PASS' || steps.verdict.outputs.verdict == 'PASS_WITH_NOTES'
        run: |
          echo "Review passed. Ready for merge."
