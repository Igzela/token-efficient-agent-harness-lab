name: agent-review

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: agent-review-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  AGENT_REPO: ${{ github.repository }}
  AGENT_GH_CMD: gh

jobs:
  review:
    runs-on: [self-hosted, vader, review]
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify head SHA
        run: |
          CURRENT=$(gh pr view ${{ inputs.pr_number }} --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT" != "${{ inputs.head_sha }}" ]; then
            echo "SHA mismatch"
            exit 1
          fi

      - name: Mark final-review
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ inputs.issue_number }} final-review

      - name: Build review prompt
        id: prompt
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/prompt_builder.py review \
            ${{ inputs.pr_number }} ${{ inputs.head_sha }} > /tmp/review-prompt.txt

      - name: Run Codex (review worker)
        id: codex
        env:
          CODEX_AUTH_TOKEN: ${{ secrets.CODEX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          codex exec \
            --target-dir "${{ github.workspace }}" \
            --goal "$(cat /tmp/review-prompt.txt)" \
            --sliding-context \
            --print \
            --no-sandbox \
            2>&1 | tee /tmp/codex-review-${{ inputs.pr_number }}.log

      - name: Parse review verdict
        id: verdict
        run: |
          python3 -c "import json,re; log=open('/tmp/codex-review-${{ inputs.pr_number }}.log').read(); m=re.search(r'\{[^}]+\"verdict\"[^}]+\}', log, re.DOTALL); v=json.loads(m.group()) if m else {'verdict':'FAIL','summary':'No verdict found'}; [print(f'{k}={v[k]}') for k in v]" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        run: |
          gh pr review ${{ inputs.pr_number }} --body \
            "## Agent Orchestrator: Final Review
          Verdict: \`${{ steps.verdict.outputs.verdict || 'FAIL' }}\`
          _Review generated by agent-orchestrator_"

      - name: Handle non-pass verdicts
        if: steps.verdict.outputs.verdict != 'PASS' && steps.verdict.outputs.verdict != 'PASS_WITH_NOTES'
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ inputs.issue_number }} agent-blocked
          exit 1
