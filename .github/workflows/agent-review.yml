name: agent-review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      issue_number:
        description: Associated issue number
        required: true
        type: number
      head_sha:
        description: Expected exact PR head SHA
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: agent-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check orchestrator gate and emergency stop
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Review disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "Emergency stop is active. Review disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: [self-hosted, vader, review]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Verify head SHA before review
        run: |
          CURRENT=$(gh pr view ${{ github.event.inputs.pr_number }} --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT" != "${{ github.event.inputs.head_sha }}" ]; then
            echo "FATAL: PR head SHA has changed. Expected ${{ github.event.inputs.head_sha }}, got $CURRENT"
            exit 1
          fi

      - name: Mark review-running
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} review-running

      - name: Build review prompt
        id: prompt
        run: |
          mkdir -p /tmp/agent-prompt
          python3 scripts/agent-control/prompt_builder.py review \
            ${{ github.event.inputs.pr_number }} \
            ${{ github.event.inputs.head_sha }} \
            > /tmp/agent-prompt/review-${{ github.event.inputs.pr_number }}.txt

      - name: Run Codex (review worker)
        id: codex
        run: |
          bash scripts/agent-control/codex_wrapper.sh \
            review \
            /tmp/agent-prompt/review-${{ github.event.inputs.pr_number }}.txt \
            /tmp/agent-output/review-${{ github.event.inputs.pr_number }} \
            "$PWD"
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}

      - name: Parse and validate review verdict
        id: verdict
        run: |
          python3 scripts/agent-control/validate_review.py \
            /tmp/agent-output/review-${{ github.event.inputs.pr_number }}/codex-last-message.json \
            ${{ github.event.inputs.pr_number }} \
            ${{ github.event.inputs.head_sha }}

      - name: Recheck PR head before recording verdict
        id: recheck
        run: |
          CURRENT=$(gh pr view ${{ github.event.inputs.pr_number }} --json headRefOid --jq '.headRefOid')
          echo "current_head=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "${{ github.event.inputs.head_sha }}" ]; then
            echo "WARNING: PR head changed during review. Current=$CURRENT expected=${{ github.event.inputs.head_sha }}"
            echo "head_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "head_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record review result
        if: steps.recheck.outputs.head_changed != 'true'
        run: |
          VERDICT="${{ steps.verdict.outputs.verdict }}"
          SUMMARY="${{ steps.verdict.outputs.summary }}"
          python3 scripts/agent-control/state_manager.py record-review \
            ${{ github.event.inputs.issue_number }} \
            ${{ github.event.inputs.pr_number }} \
            "${{ github.event.inputs.head_sha }}" \
            "$VERDICT" \
            "$SUMMARY"

      - name: Post review comment and handle PASS
        if: steps.recheck.outputs.head_changed != 'true'
        run: |
          VERDICT="${{ steps.verdict.outputs.verdict }}"
          SUMMARY="${{ steps.verdict.outputs.summary }}"

          gh pr comment ${{ github.event.inputs.pr_number }} --body \
            "## Agent Orchestrator: Final Review

          **Verdict:** \`${VERDICT}\`
          **Summary:** ${SUMMARY}
          **Reviewed head:** \`${{ github.event.inputs.head_sha }}\`

          ---
          _Review generated by agent-orchestrator_"

          if [ "$VERDICT" = "PASS" ]; then
            python3 scripts/agent-control/state_manager.py set-labels \
              ${{ github.event.inputs.issue_number }} review-passed
            python3 scripts/agent-control/state_manager.py remove-labels \
              ${{ github.event.inputs.issue_number }} review-running

            python3 scripts/agent-control/state_manager.py comment \
              ${{ github.event.inputs.issue_number }} \
              "## Agent Orchestrator: Review Passed
            PR: #${{ github.event.inputs.pr_number }}
            Head: \`${{ github.event.inputs.head_sha }}\`
            Verdict: \`PASS\`
            Ready for merge."

            if [ "${AGENT_AUTO_MERGE_ENABLED:-false}" = "true" ]; then
              echo "Dispatching merge workflow"
              gh workflow run agent-merge.yml \
                --ref main \
                -f pr_number="${{ github.event.inputs.pr_number }}" \
                -f issue_number="${{ github.event.inputs.issue_number }}" \
                -f head_sha="${{ github.event.inputs.head_sha }}"
            else
              echo "Auto-merge disabled. Review recorded but merge not dispatched."
            fi
          else
            python3 scripts/agent-control/state_manager.py set-labels \
              ${{ github.event.inputs.issue_number }} agent-blocked
            python3 scripts/agent-control/state_manager.py remove-labels \
              ${{ github.event.inputs.issue_number }} review-running
            exit 1
          fi
        env:
          AGENT_AUTO_MERGE_ENABLED: ${{ vars.AGENT_AUTO_MERGE_ENABLED }}

      - name: Handle head changed during review
        if: steps.recheck.outputs.head_changed == 'true'
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} agent-blocked
          python3 scripts/agent-control/state_manager.py remove-labels \
            ${{ github.event.inputs.issue_number }} review-running
          python3 scripts/agent-control/state_manager.py comment \
            ${{ github.event.inputs.issue_number }} \
            "## Agent Orchestrator: Review Aborted
          PR head changed during review. Expected \`${{ github.event.inputs.head_sha }}\`, got \`${{ steps.recheck.outputs.current_head }}\`.
          Task marked \`agent-blocked\`."
          exit 1

  failure-handler:
    needs: review
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Mark blocked on review failure
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} agent-blocked
          python3 scripts/agent-control/state_manager.py remove-labels \
            ${{ github.event.inputs.issue_number }} review-running
