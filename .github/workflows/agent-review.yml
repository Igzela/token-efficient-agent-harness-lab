name: agent-review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      issue_number:
        description: Associated Issue number
        required: true
        type: number
      head_sha:
        description: Expected exact PR head SHA
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check orchestrator gate and emergency stop
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ] || [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: [self-hosted, vader, review]
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Verify Issue and PR binding before review
        run: |
          python3 scripts/agent-control/state_manager.py verify-binding \
            "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "${{ inputs.head_sha }}"

      - name: Verify exact head before review
        run: |
          CURRENT=$(gh pr view "${{ inputs.pr_number }}" --json headRefOid --jq '.headRefOid')
          test "$CURRENT" = "${{ inputs.head_sha }}"

      - name: Mark review-running
        run: python3 scripts/agent-control/state_manager.py set-labels "${{ inputs.issue_number }}" review-running

      - name: Build review prompt
        run: |
          mkdir -p /tmp/agent-prompt
          python3 scripts/agent-control/prompt_builder.py review \
            "${{ inputs.pr_number }}" "${{ inputs.head_sha }}" \
            > /tmp/agent-prompt/review-${{ inputs.pr_number }}.txt

      - name: Runtime gate before Codex
        run: python3 scripts/agent-control/control_state.py require-live

      - name: Run Codex review worker
        run: |
          bash scripts/agent-control/codex_wrapper.sh \
            review \
            /tmp/agent-prompt/review-${{ inputs.pr_number }}.txt \
            /tmp/agent-output/review-${{ inputs.pr_number }} \
            "$PWD"

      - name: Runtime gate after Codex
        run: python3 scripts/agent-control/control_state.py require-live

      - name: Validate review output against canonical JSON Schema
        id: verdict
        run: |
          uv run --no-project --with jsonschema python scripts/agent-control/validate_review.py \
            /tmp/agent-output/review-${{ inputs.pr_number }}/codex-last-message.json \
            "${{ inputs.pr_number }}" "${{ inputs.head_sha }}"

      - name: Recheck head, association, and emergency stop before recording review
        id: recheck
        run: |
          python3 scripts/agent-control/control_state.py require-live
          python3 scripts/agent-control/state_manager.py verify-binding \
            "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "${{ inputs.head_sha }}"
          CURRENT=$(gh pr view "${{ inputs.pr_number }}" --json headRefOid --jq '.headRefOid')
          test "$CURRENT" = "${{ inputs.head_sha }}"

      - name: Record review result
        run: |
          python3 scripts/agent-control/control_state.py require-live
          python3 scripts/agent-control/state_manager.py record-review \
            "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "${{ inputs.head_sha }}" \
            "${{ steps.verdict.outputs.verdict }}" "${{ steps.verdict.outputs.summary }}"

      - name: Post review result and handle verdict
        run: |
          python3 scripts/agent-control/control_state.py require-live
          VERDICT="${{ steps.verdict.outputs.verdict }}"
          SUMMARY="${{ steps.verdict.outputs.summary }}"
          gh pr comment "${{ inputs.pr_number }}" --body "## Agent Orchestrator: Final Review

          **Verdict:** `$VERDICT`
          **Summary:** $SUMMARY
          **Reviewed head:** `${{ inputs.head_sha }}`"
          if [ "$VERDICT" = "PASS" ]; then
            python3 scripts/agent-control/control_state.py require-live
            python3 scripts/agent-control/state_manager.py set-labels "${{ inputs.issue_number }}" review-passed
            if [ "${{ vars.AGENT_AUTO_MERGE_ENABLED }}" = "true" ]; then
              python3 scripts/agent-control/control_state.py require-live
              gh workflow run agent-controller.yml --ref main \
                -f command=dispatch-merge \
                -f pr_number="${{ inputs.pr_number }}" \
                -f issue="${{ inputs.issue_number }}" \
                -f head_sha="${{ inputs.head_sha }}"
            else
              echo "Auto-merge remains disabled."
            fi
          else
            python3 scripts/agent-control/state_manager.py set-labels "${{ inputs.issue_number }}" agent-blocked
            exit 1
          fi

  failure-handler:
    needs: review
    if: failure()
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Mark blocked on review failure
        run: |
          python3 scripts/agent-control/state_manager.py set-labels "${{ inputs.issue_number }}" agent-blocked
