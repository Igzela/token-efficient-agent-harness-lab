name: agent-ci-repair

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to repair
        required: true
        type: number
      issue_number:
        description: Associated issue number
        required: true
        type: number
      head_sha:
        description: Expected exact head SHA
        required: true
        type: string
      failed_jobs:
        description: JSON array of failed job names
        required: true
        type: string
      repair_count:
        description: Current repair attempt number
        required: true
        type: number
      ci_run_id:
        description: CI run ID that failed
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-ci-repair-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, vader, ci-repair]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Check orchestrator gate
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. CI repair disabled."
            exit 0
          fi
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}

      - name: Configure git
        run: |
          gh auth setup-git
          git config user.name "agent-orchestrator[bot]"
          git config user.email "agent-orchestrator[bot]@users.noreply.github.com"

      - name: Verify head SHA
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ github.event.inputs.head_sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FATAL: Head SHA mismatch. Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Mark ci-repairing
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} ci-repairing

      - name: Build repair prompt
        id: prompt
        env:
          AGENT_FAILED_LOGS: ""
        run: |
          mkdir -p /tmp/agent-prompt
          python3 scripts/agent-control/prompt_builder.py ci-repair \
            ${{ github.event.inputs.pr_number }} \
            ${{ github.event.inputs.head_sha }} \
            > /tmp/agent-prompt/repair-${{ github.event.inputs.pr_number }}.txt

      - name: Run Codex (CI repair)
        id: codex
        run: |
          bash scripts/agent-control/codex_wrapper.sh \
            ci-repair \
            /tmp/agent-prompt/repair-${{ github.event.inputs.pr_number }}.txt \
            /tmp/agent-output/repair-${{ github.event.inputs.pr_number }}
        env:
          AGENT_ORCHESTRATOR_ENABLED: "true"

      - name: Push repair commits
        run: |
          PR_BRANCH=$(gh pr view ${{ github.event.inputs.pr_number }} --json headRefName --jq '.headRefName')
          git add -A
          git diff --cached --quiet || git commit -m "ci-repair: attempt ${{ github.event.inputs.repair_count }} for #${{ github.event.inputs.issue_number }}"

          # Recheck head before push
          git fetch origin "$PR_BRANCH"
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "origin/$PR_BRANCH" 2>/dev/null || echo "")
          if [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
            echo "ERROR: Remote head changed. Aborting push."
            exit 1
          fi

          git push origin "HEAD:$PR_BRANCH"

      - name: Record CI repair state
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          python3 scripts/agent-control/state_manager.py record-ci \
            ${{ github.event.inputs.issue_number }} \
            ${{ github.event.inputs.pr_number }} \
            "$HEAD_SHA" \
            "${{ github.event.inputs.ci_run_id }}" \
            "failure_repair_${{ github.event.inputs.repair_count }}"

      - name: Comment on issue
        run: |
          python3 scripts/agent-control/state_manager.py comment \
            ${{ github.event.inputs.issue_number }} \
            "## Agent Orchestrator: CI Repair Attempt #${{ github.event.inputs.repair_count }}
          PR: #${{ github.event.inputs.pr_number }}
          CI repair attempt #${{ github.event.inputs.repair_count }} completed. CI will re-trigger on push."

  failure-handler:
    needs: repair
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Mark blocked on repair failure
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} agent-blocked
          python3 scripts/agent-control/state_manager.py comment \
            ${{ github.event.inputs.issue_number }} \
            "## Agent Orchestrator: CI Repair Failed
          PR: #${{ github.event.inputs.pr_number }}
          The CI repair worker encountered an error.
          This task has been marked \`agent-blocked\`."
