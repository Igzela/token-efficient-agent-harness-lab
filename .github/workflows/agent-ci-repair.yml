name: agent-ci-repair

env:
  INPUT_HEAD_SHA: ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: number
      repair_count:
        required: true
        type: number

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-ci-repair-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Verify live control, run identity, and exact Issue-to-PR binding
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py verify-binding "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA"
          python3 scripts/agent-control/ci_verifier.py verify-failed-run \
            "${{ inputs.ci_run_id }}" "$INPUT_HEAD_SHA"
      - name: Fetch bounded failed jobs, steps, and redacted logs by run ID
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/ci_evidence.py "${{ inputs.ci_run_id }}" > "$RUNNER_TEMP/repair-evidence.json"
      - name: Recheck control immediately before repair evidence upload
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Upload bounded repair evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repair-evidence-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/repair-evidence.json
          retention-days: 1
          if-no-files-found: error

  vader-repair:
    needs: prepare
    runs-on: [self-hosted, vader, agent-worker]
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
      issues: read
    outputs:
      branch: ${{ steps.worktree.outputs.branch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Clean only verified stale terminal worktrees
        env:
          AGENT_REPO_PATH: ${{ github.workspace }}
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/cleanup.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repair-evidence-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/repair-input
      - name: Create repair worktree from exact failed head
        id: worktree
        run: |
          RESULT=$(python3 scripts/agent-control/worktree_manager.py create "${{ inputs.issue_number }}" "agent/issue-${{ inputs.issue_number }}" "$INPUT_HEAD_SHA")
          WORKTREE=$(jq -er '.worktree_path' <<<"$RESULT")
          test -d "$WORKTREE"
          {
            echo "worktree_path=$WORKTREE"
            echo "branch=$(jq -er '.branch' <<<"$RESULT")"
          } >> "$GITHUB_OUTPUT"
      - name: Build repair prompt from trusted checkout and bounded evidence
        env:
          AGENT_REPAIR_COUNT: ${{ inputs.repair_count }}
        run: |
          python3 scripts/agent-control/prompt_builder.py ci-repair "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA" \
            "$RUNNER_TEMP/repair-input/repair-evidence.json" > "$RUNNER_TEMP/repair-prompt.txt"
      - name: Recheck control immediately before Codex repair
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Run Codex repair with no GitHub credentials
        run: |
          bash scripts/agent-control/codex_wrapper.sh ci-repair "$RUNNER_TEMP/repair-prompt.txt" \
            "$RUNNER_TEMP/codex-output" "${{ steps.worktree.outputs.worktree_path }}"
      - name: Recheck control before accepting repair artifact
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          cd "${{ steps.worktree.outputs.worktree_path }}"
          git diff --check
          python3 "$GITHUB_WORKSPACE/scripts/agent-control/artifact_contract.py" create ci-repair \
            "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA" "$INPUT_HEAD_SHA" \
            "${{ steps.worktree.outputs.branch }}" "$(cat "$RUNNER_TEMP/codex-output/codex-exit-code.txt")" \
            '[{"command":"git diff --check","exit_code":0}]' "$RUNNER_TEMP/agent-artifact" \
            "${{ inputs.ci_run_id }}" "${{ inputs.repair_count }}"
      - name: Recheck control immediately before repair artifact upload
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Upload untrusted repair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repair-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/agent-artifact
          retention-days: 1
          if-no-files-found: error
      - name: Remove repair worktree
        if: always()
        run: python3 scripts/agent-control/worktree_manager.py remove "${{ inputs.issue_number }}" "agent/issue-${{ inputs.issue_number }}"

  finalize:
    needs: vader-repair
    if: needs.vader-repair.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      AGENT_REPO: ${{ github.repository }}
      BRANCH: ${{ needs.vader-repair.outputs.branch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repair-${{ github.run_id }}-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/agent-artifact
      - name: Validate artifact, binding, and unmoved remote head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py verify-binding "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$INPUT_HEAD_SHA"
          python3 scripts/agent-control/artifact_contract.py validate ci-repair "${{ inputs.issue_number }}" \
            "${{ inputs.pr_number }}" "$INPUT_HEAD_SHA" "$INPUT_HEAD_SHA" "$BRANCH" "$RUNNER_TEMP/agent-artifact"
          gh issue view "${{ inputs.issue_number }}" --json body --jq .body > "$RUNNER_TEMP/task-issue-body.md"
          python3 scripts/agent-control/artifact_contract.py validate-scope "$RUNNER_TEMP/task-issue-body.md" \
            "$RUNNER_TEMP/agent-artifact/agent-result.json"
      - name: Recheck control immediately before applying repair patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Apply repair patch to clean exact failed head
        run: |
          set -euo pipefail
          git checkout --detach "$INPUT_HEAD_SHA"
          git apply --index --binary "$RUNNER_TEMP/agent-artifact/agent.patch"
          python3 scripts/agent-control/artifact_contract.py validate-index "$RUNNER_TEMP/agent-artifact/agent-result.json"
          git diff --cached --check
      - name: Recheck control immediately before repair commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Commit validated repair
        id: commit
        run: |
          git config user.name "agent-orchestrator[bot]"
          git config user.email "agent-orchestrator[bot]@users.noreply.github.com"
          git commit -m "agent: repair CI for #${{ inputs.issue_number }}"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Recheck control immediately before repair push
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Push branch with isolated temporary credentials
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_PUSH_TOKEN:-}" || { echo "FATAL: AGENT_PUSH_TOKEN is missing" >&2; exit 1; }
          AUTH_DIR="$RUNNER_TEMP/agent-push-auth"
          mkdir -p "$AUTH_DIR"
          trap 'rm -rf "$AUTH_DIR"' EXIT
          cat > "$AUTH_DIR/askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in *Username*) printf '%s' x-access-token ;; *) printf '%s' "$AGENT_PUSH_TOKEN" ;; esac
          EOF
          chmod 700 "$AUTH_DIR/askpass"
          GIT_ASKPASS="$AUTH_DIR/askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= -c credential.useHttpPath=true \
            push --force-with-lease="refs/heads/$BRANCH:$INPUT_HEAD_SHA" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
      - name: Recheck control and verify the newly pushed exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          HEAD="${{ steps.commit.outputs.head_sha }}"
          python3 scripts/agent-control/pr_binding.py verify-post-push \
            "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$BRANCH" "$HEAD"
      - name: Update the canonical PR after post-push verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          BODY_FILE="$RUNNER_TEMP/agent-pr-body.md"
          printf 'Closes #%s\n\n<!-- agent-orchestrator-binding: {"issue_number": %s, "branch": "%s"} -->\n' \
            "${{ inputs.issue_number }}" "${{ inputs.issue_number }}" "$BRANCH" > "$BODY_FILE"
          python3 scripts/agent-control/pr_binding.py create-or-update \
            "${{ inputs.issue_number }}" "$BRANCH" "${{ steps.commit.outputs.head_sha }}" \
            "agent: repair CI for #${{ inputs.issue_number }}" "$BODY_FILE" >/dev/null
      - name: Persist new exact head, invalidate old evidence, and acquire CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          HEAD="${{ steps.commit.outputs.head_sha }}"
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py record-worker "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$HEAD" ci-repair "{\"branch\":\"$BRANCH\",\"failed_run_id\":${{ inputs.ci_run_id }},\"repair_attempt\":${{ inputs.repair_count }}}"
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py invalidate-evidence "${{ inputs.issue_number }}" \
            "${{ inputs.pr_number }}" "$HEAD" "$INPUT_HEAD_SHA"
          EXISTING=$(python3 scripts/agent-control/state_manager.py read-ci-acquisition "${{ inputs.issue_number }}" \
            "${{ inputs.pr_number }}" "$HEAD")
          if [ "$EXISTING" != "null" ]; then
            CI="$EXISTING"
          else
            python3 scripts/agent-control/control_state.py require-live >/dev/null
            CI=$(python3 scripts/agent-control/ci_verifier.py acquire "${{ inputs.pr_number }}" "$BRANCH" "$HEAD")
          fi
          RUN_ID=$(jq -er '.workflow_run_id' <<<"$CI")
          if [ "$EXISTING" = "null" ]; then
            SOURCE=$(jq -er '.source' <<<"$CI")
            DUPLICATES=$(jq -c '.duplicate_run_ids // []' <<<"$CI")
            METADATA=$(jq -c '{observed_run_ids,selection_reason,superseded_run_ids,unsupported_run_ids,fallback_dispatched}' <<<"$CI")
            python3 scripts/agent-control/control_state.py require-live >/dev/null
            python3 scripts/agent-control/state_manager.py record-ci-acquisition "${{ inputs.issue_number }}" \
              "${{ inputs.pr_number }}" "$HEAD" "$RUN_ID" "$SOURCE" "$DUPLICATES" "$METADATA"
          fi
          EXTRA=$(jq -c --argjson id "$RUN_ID" --argjson repairs "${{ inputs.repair_count }}" '{workflow_name,required_jobs,successful_jobs:[],workflow_run_id:$id,repair_count:$repairs}' scripts/agent-control/ci_requirements.json)
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py record-ci "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" "$HEAD" "$RUN_ID" dispatched "$EXTRA"

  failure-handler:
    needs: [prepare, vader-repair, finalize]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Release only the failed repair's exact active capacity
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent-control/state_manager.py release-failed-evidence \
            "${{ inputs.issue_number }}" ci-repairing agent-blocked ci-repair \
            "${{ github.run_id }}" "$INPUT_HEAD_SHA" "${{ inputs.ci_run_id }}" \
            "${{ inputs.repair_count }}"
