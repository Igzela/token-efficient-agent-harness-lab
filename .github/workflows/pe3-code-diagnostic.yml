name: pe3-code-diagnostic

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      ACP_TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: clippy,rustfmt
      - name: Capture exact failures
        run: |
          set +e
          cargo clippy -p engine --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo "clippy_exit=$?" >> clippy.log
          cargo test -p engine --features pg-tests -- --test-threads=1 > pg.log 2>&1
          echo "pg_exit=$?" >> pg.log
          tail -n 120 clippy.log
          tail -n 160 pg.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pe3-code-diagnostic
          path: |
            clippy.log
            pg.log
          retention-days: 1
