name: pe3-fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: rustfmt
      - name: Apply bounded fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/tests/test_pe3_operator_action_repair.rs')
          text = path.read_text()
          text = text.replace('body["error"]["code"]', 'body["code"]')
          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/tests/test_pe3_operator_action_repair.rs \
                  engine/src/storage/local_product_store/workflow_runs/operator_approvals.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PE3-REPAIR-1 correct API error assertions and formatting"
          git push origin HEAD:${{ github.head_ref }}
