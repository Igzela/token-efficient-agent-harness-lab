name: tests

run-name: tests-${{ inputs.dispatch_nonce || github.run_id }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA expected by an agent-triggered run
        required: true
        type: string
      dispatch_nonce:
        description: Unique fallback-dispatch identity
        required: false
        default: ""
        type: string

concurrency:
  group: tests-${{ github.event.pull_request.number || inputs.expected_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  classify-change-impact:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      mode: ${{ steps.classify.outputs.mode }}
      reused_pr: ${{ steps.classify.outputs.reused_pr }}
      has_rust: ${{ steps.classify.outputs.has_rust }}
      has_ts: ${{ steps.classify.outputs.has_ts }}
    steps:
      - name: Check out classifier candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify classifier candidate head
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Check out trusted base classifier
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.forced != true)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: trusted-base
          persist-credentials: false
      - name: Classify exact candidate diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PUSH_FORCED: ${{ github.event.forced || false }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          full_mode() {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reused_pr=false" >> "$GITHUB_OUTPUT"
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
          }
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            full_mode
            exit 0
          fi
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${EVENT_NAME}" != "push" ]; then
            full_mode
            exit 0
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            if [ "${PUSH_FORCED}" = "true" ] || [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              full_mode
              exit 0
            fi
          fi
          test -n "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          if ! git merge-base --is-ancestor "${BASE_SHA}" "${EXPECTED_SHA}"; then
            full_mode
            exit 0
          fi
          if [ "${EVENT_NAME}" = "push" ] && [ -f trusted-base/scripts/ci/main_reuse_evidence.py ]; then
            if python3 trusted-base/scripts/ci/main_reuse_evidence.py \
              --repository "${GITHUB_REPOSITORY}" \
              --before "${BASE_SHA}" \
              --after "${EXPECTED_SHA}" \
              --repository-root "${GITHUB_WORKSPACE}" \
              --receipt main-ci-reuse.json; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "mode=reused_pr" >> "$GITHUB_OUTPUT"
              echo "reused_pr=true" >> "$GITHUB_OUTPUT"
              echo "has_rust=false" >> "$GITHUB_OUTPUT"
              echo "has_ts=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Trusted PR reuse proof unavailable; continuing with exact diff classification."
          fi
          git diff --name-only "${BASE_SHA}" "${EXPECTED_SHA}" > changed-files.txt
          git diff --raw --no-renames "${BASE_SHA}" "${EXPECTED_SHA}" > changed-raw.txt
          args=()
          while IFS= read -r path; do
            [ -n "${path}" ] && args+=(--path "${path}")
          done < changed-files.txt
          python3 trusted-base/scripts/ci/classify_change_impact.py "${args[@]}" > impact.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          data = json.load(open("impact.json", encoding="utf-8"))
          docs_only = data.get("docs_only")
          if not isinstance(docs_only, bool):
              raise SystemExit("trusted classifier did not return a boolean docs_only result")
          allowed_modes = {"000000", "100644"}
          for line in open("changed-raw.txt", encoding="utf-8"):
              if not line.startswith(":") or "\t" not in line:
                  raise SystemExit("unparseable raw diff identity")
              fields = line.split("\t", 1)[0].split()
              if len(fields) < 2:
                  raise SystemExit("incomplete raw diff identity")
              old_mode = fields[0].removeprefix(":")
              new_mode = fields[1]
              if old_mode not in allowed_modes or new_mode not in allowed_modes:
                  docs_only = False
          has_rust = data.get("has_rust", True) if not docs_only else False
          has_ts = data.get("has_ts", True) if not docs_only else False
          print(f"docs_only={str(docs_only).lower()}")
          print(f"mode={'docs_only' if docs_only else 'full'}")
          print("reused_pr=false")
          print(f"has_rust={str(has_rust).lower()}")
          print(f"has_ts={str(has_ts).lower()}")
          PY
      - name: Upload main CI reuse receipt
        if: steps.classify.outputs.reused_pr == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-ci-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: main-ci-reuse.json
          retention-days: 1
          if-no-files-found: error

  python-tests:
    needs: classify-change-impact
    # Steward's bubblewrap contract requires unprivileged user namespaces.
    # Keep this lane on a runner whose baseline provides that capability;
    # never relax the runner's kernel/AppArmor policy from a PR workflow.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to run without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Set up uv
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      - name: Report documentation-only lane
        if: needs.classify-change-impact.outputs.docs_only == 'true'
        run: echo "Canonical docs-only lane; runtime and compiler checks are not applicable to this exact head."
      - name: Report accepted PR reuse lane
        if: needs.classify-change-impact.outputs.mode == 'reused_pr'
        run: echo "Heavy checks are reused from the tree-identical, exact-head accepted PR; terminal evidence will revalidate the receipt."
      - name: Check GitHub Action pins
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: bash scripts/check_github_action_pins.sh
      - name: Run security baseline checker
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project python tools/check_security_baseline.py
      - name: Check agent handoff
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project python scripts/check_agent_handoff.py
      - name: Check exact-head diff
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "${base_sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${base_sha}"
            git diff --check "${base_sha}" "${EXPECTED_SHA}"
          else
            git diff --check "${EXPECTED_SHA}^" "${EXPECTED_SHA}"
          fi
      - name: Check public README surface
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project python tools/check_readme_public_surface.py
      - name: Check site OG metadata
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project python tools/check_site_og_metadata.py
      - name: Run CI lane classifier tests
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project python -m unittest tools.test_classify_change_impact
      - name: Run CI workflow optimization contract tests
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project --with pyyaml python -m unittest tools.test_ci_workflow_optimization tools.test_ci_lane_contract
      - name: Parse workflow YAML
        if: needs.classify-change-impact.outputs.mode != 'reused_pr'
        run: uv run --no-project --with pyyaml python scripts/check_agent_workflow_yaml.py
      - name: Check wire codegen drift
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: bash scripts/check_wire_codegen_drift.sh
      - name: Run relocated utility tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: uv run --no-project --with pyyaml python -m unittest discover -s tools -p "test_*.py"
      - name: Run no-provider demo unit tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: uv run --no-project python -m unittest tests.test_demo_no_provider
      - name: Run exact-head action contract tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: uv run --no-project python -m unittest tests.test_exact_head_action
      - name: Run external validation contract tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: uv run --no-project python -m unittest tests.test_external_validation
      - name: Check OpenCode fixture adapter manifest
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: bash scripts/check_opencode_fixture_manifest.sh
      - name: Run OpenCode fixture adapter tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: PYTHONPATH=adapters/opencode/src uv run --no-project python -m unittest discover -s adapters/opencode/tests -v
      - name: Verify canonical orchestrator regression suite is wired
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: uv run --no-project python scripts/verify_orchestrator_test_suite.py
      - name: Install bubblewrap
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          test -x /usr/bin/bwrap
      - name: Verify bubblewrap user namespace capability
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: |
          set -euo pipefail
          if ! /usr/bin/unshare -Urn /usr/bin/true; then
            echo "runner lacks the user/network namespace required by Steward sandboxing" >&2
            exit 1
          fi
          /usr/bin/bwrap \
            --die-with-parent \
            --unshare-user \
            --unshare-net \
            --unshare-pid \
            --clearenv \
            --tmpfs / \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --dir /tmp \
            -- /usr/bin/true
      - name: Configure test git identity
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: |
          git config --global user.name "CI Agent"
          git config --global user.email "ci@example.invalid"
      - name: Run orchestrator regression tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: |
          # Canonical orchestrator regression test files:
          # tests/test_agent_shadow_steward.py
          # tests/test_agent_steward.py
          # tests/test_agent_steward_faults.py
          # tests/test_agent_steward_journal.py
          # tests/test_agent_steward_pra.py
          # tests/test_agent_steward_prb.py
          # tests/test_agent_steward_prc.py
          # tests/test_mission_contract.py
          # tests/test_mission_completion_semantics.py
          # tests/test_review_convergence.py
          # tests/test_review_loop.py
          # tests/test_steward_deferred_acceptance.py
          PYTHONPATH=scripts/agent-control:. python3 -m unittest \
            tests.test_agent_shadow_steward \
            tests.test_agent_steward \
            tests.test_agent_steward_faults \
            tests.test_agent_steward_journal \
            tests.test_agent_steward_pra \
            tests.test_agent_steward_prb \
            tests.test_agent_steward_prc \
            tests.test_mission_contract \
            tests.test_mission_completion_semantics \
            tests.test_review_convergence \
            tests.test_review_loop \
            tests.test_steward_deferred_acceptance
      - name: Run Python SDK tests
        if: needs.classify-change-impact.outputs.mode == 'full'
        run: cd sdk/python && PYTHONPATH=src uv run --no-project python -m unittest discover -s tests

  rust-tests:
    needs: classify-change-impact
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to run without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Report documentation-only lane
        if: needs.classify-change-impact.outputs.docs_only == 'true'
        run: echo "rust-tests not applicable to a trusted documentation-only diff"
      - name: Report accepted PR reuse lane
        if: needs.classify-change-impact.outputs.mode == 'reused_pr'
        run: echo "rust-tests reused from the accepted tree-identical PR head"
      - name: Report non-Rust diff lane
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust == 'false'
        run: echo "rust-tests not applicable to a diff with zero Rust impact"
      - name: Install bubblewrap and mold linker
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends bubblewrap mold clang
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version
          mold --version
      - name: Install Rust toolchain
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up sccache
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.15.0"
          disable_annotations: true
      - name: Cache Cargo registry and Git dependencies
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-rust-deps-2026-07-10-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-2026-07-10-
      - name: Install pytest for the frozen RWE verifier shape
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pytest
          python3 -m pytest --version
      - name: Install cargo-nextest
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-nextest@0.9.143
      - name: Run cargo test
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: scripts/ci/run_rust_tests.py
      - name: Run doctests
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: cargo test --doc -p engine
      - name: Check formatting
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: cargo fmt --check
      - name: Run clippy
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: |
          CARGO_TERM_COLOR=never cargo audit --version | grep -F 'cargo-audit-audit 0.22.2'
          cargo audit --deny warnings
      - name: Report sccache statistics
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        continue-on-error: true
        run: '"${SCCACHE_PATH}" --show-stats'

  pg-integration-tests:
    needs: classify-change-impact
    runs-on: ubuntu-latest
    env:
      ACP_TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
      ACP_PRODUCT_GOLDEN_PATH: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      PG_CONTAINER: ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to run without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Report documentation-only lane
        if: needs.classify-change-impact.outputs.docs_only == 'true'
        run: echo "pg-integration-tests not applicable to a trusted documentation-only diff"
      - name: Report accepted PR reuse lane
        if: needs.classify-change-impact.outputs.mode == 'reused_pr'
        run: echo "pg-integration-tests reused from the accepted tree-identical PR head"
      - name: Report non-Rust diff lane
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust == 'false'
        run: echo "pg-integration-tests not applicable to a diff with zero Rust impact"
      - name: Start PostgreSQL service
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: |
          set -euo pipefail
          docker run --detach --name "${PG_CONTAINER}" \
            --env POSTGRES_USER=testuser \
            --env POSTGRES_PASSWORD=testpass \
            --env POSTGRES_DB=testdb \
            --publish 5432:5432 \
            postgres:16
          for attempt in $(seq 1 30); do
            if docker exec "${PG_CONTAINER}" pg_isready -U testuser; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${PG_CONTAINER}"
          exit 1
      - name: Install bubblewrap and mold linker
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends bubblewrap mold clang
          test -x /usr/bin/bwrap
          mold --version
      - name: Install Rust toolchain
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up sccache
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.15.0"
          disable_annotations: true
      - name: Cache Cargo registry and Git dependencies
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-rust-deps-2026-07-10-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-2026-07-10-
      - name: Install pytest for the frozen RWE verifier shape
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pytest
          python3 -m pytest --version
      - name: Run PostgreSQL integration tests
        if: needs.classify-change-impact.outputs.mode == 'full' && needs.classify-change-impact.outputs.has_rust != 'false'
        run: bash scripts/ci/run_postgres_tests.sh
      - name: Verify PostgreSQL owner evidence through the PE-6 harness
