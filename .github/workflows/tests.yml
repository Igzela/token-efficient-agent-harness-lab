name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Check wire codegen drift
        run: bash scripts/check_wire_codegen_drift.sh
      - name: Check GitHub Action pins
        run: bash scripts/check_github_action_pins.sh
      - name: Run security baseline checker
        run: uv run --no-project python tools/check_security_baseline.py
      - name: Run relocated utility tests
        run: uv run --no-project python -m unittest discover -s tools -p "test_*.py"
      - name: Run Python SDK tests
        run: cd sdk/python && PYTHONPATH=src uv run --no-project python -m unittest discover -s tests

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Run cargo test
        run: cargo test -p engine
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings
      - name: Audit Rust dependencies
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit --deny warnings

  pg-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      ACP_TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Run PostgreSQL integration tests
        run: cargo test -p engine --features pg-tests -- --test-threads=1

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install SDK dependencies
        run: cd sdk/typescript && bun install --frozen-lockfile
      - name: Run SDK tests
        run: cd sdk/typescript && bun run test
      - name: Build SDK package
        run: cd sdk/typescript && bun run build
      - name: Audit SDK dependencies
        run: cd sdk/typescript && bun audit
      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile
      - name: Check dashboard
        run: cd dashboard && bun run lint && bun run typecheck && bun run build
      - name: Audit dashboard dependencies
        run: cd dashboard && bun audit

  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Build static dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build:static
      - name: Build native engine
        run: cargo build -p engine
      - name: Smoke native runtime
        run: uv run --no-project python scripts/smoke_native_runtime.py
      - name: Smoke adaptive stub completion
        run: bash scripts/smoke_adaptive_stub_completion.sh

  rust-typescript-cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Verify Rust + TypeScript stack
        run: bash scripts/verify_rust_typescript_stack.sh

  pe3-atomic-owner-patch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: rustfmt
      - name: Apply bounded owner patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path("engine/src/storage/local_product_store/workflow_runs.rs")
          text = workflow.read_text()
          old = "mod dag_mutations;\nmod queue_lease;"
          new = "mod dag_mutations;\nmod operator_approvals;\nmod queue_lease;"
          if old not in text and new not in text:
              raise SystemExit("workflow module anchor missing")
          workflow.write_text(text.replace(old, new, 1))

          handler = Path("engine/src/http_server/handlers/operator_decision_actions.rs")
          text = handler.read_text()
          anchor = '''    }\n\n    let actor = authorize(&state, &headers, "dispatch:read", uri.path(), &request_id.0)?.api_key_id;'''
          replacement = '''    }\n    if matches!(\n        request.action,\n        OperatorDecisionAction::Rollback\n            | OperatorDecisionAction::Inspect\n            | OperatorDecisionAction::Acknowledge\n    ) {\n        return Err(unsupported(\n            "no compatible existing action owner is available",\n        ));\n    }\n\n    let actor = authorize(&state, &headers, "dispatch:read", uri.path(), &request_id.0)?.api_key_id;'''
          if anchor not in text and replacement not in text:
              raise SystemExit("unsupported-action anchor missing")
          text = text.replace(anchor, replacement, 1)

          start = text.index("        OperatorDecisionAction::Approve | OperatorDecisionAction::Reject => {")
          end = text.index("        OperatorDecisionAction::Resume => {", start)
          approval_block = '''        OperatorDecisionAction::Approve | OperatorDecisionAction::Reject => {\n            require_source_kind(&current_source, "approval", "approval source is required")?;\n            let approval_id = approval_evidence_id(&current_source, &request.action)?;\n            let decision = if matches!(request.action, OperatorDecisionAction::Approve) {\n                "approved"\n            } else {\n                "rejected"\n            };\n            store\n                .resolve_requested_workflow_run_approval(\n                    &current_item.resource_id,\n                    &approval_id,\n                    decision,\n                    &actor,\n                    request.reason.as_deref(),\n                )\n                .map_err(|error| {\n                    ApiError::with_code(\n                        StatusCode::CONFLICT,\n                        "operator_decision_source_changed",\n                        error,\n                    )\n                })?\n        }\n'''
          text = text[:start] + approval_block + text[end:]
          handler.write_text(text)

          tests = Path("engine/tests/test_pe3_operator_action_repair.rs")
          text = tests.read_text()
          marker = "async fn concurrent_approval_resolution_allows_exactly_one_owner_write()"
          if marker not in text:
              text += r'''

          #[tokio::test]
          async fn concurrent_approval_resolution_allows_exactly_one_owner_write() {
              let directory = tempdir().unwrap();
              let path = directory.path().join("local.db");
              let (store, clock) = make_store(&path, "2026-07-11T00:00:00Z");
              let run = create_run(&store, "approval-race", json!([]), json!([]));
              request_approval(&store, &run, "node-z");
              let queue = store
                  .operator_decision_queue("2026-07-11T00:00:00Z", 300, 100, 0)
                  .unwrap();
              let item = item_for_action(&queue, OperatorDecisionAction::Approve);
              clock.set("2026-07-11T00:00:10Z");
              let app = build_axum_router(AxumApiState::new().with_local_store(store));
              let body = action_body(&queue, OperatorDecisionAction::Approve, &queue.generated_at);
              let (left, right) = tokio::join!(
                  post_action(app.clone(), &item.decision_id, body.clone()),
                  post_action(app, &item.decision_id, body),
              );
              let statuses = [left.0, right.0];
              assert_eq!(statuses.iter().filter(|status| **status == StatusCode::OK).count(), 1);
              assert_eq!(
                  statuses
                      .iter()
                      .filter(|status| **status == StatusCode::CONFLICT)
                      .count(),
                  1
              );

              let connection = rusqlite::Connection::open(path).unwrap();
              let resolved: i64 = connection
                  .query_row(
                      "SELECT COUNT(*) FROM workflow_run_approvals WHERE decision IN ('approved', 'rejected')",
                      [],
                      |row| row.get(0),
                  )
                  .unwrap();
              assert_eq!(resolved, 1);
          }

          #[tokio::test]
          async fn approval_execution_survives_store_restart() {
              let directory = tempdir().unwrap();
              let path = directory.path().join("local.db");
              let (store, clock) = make_store(&path, "2026-07-11T00:00:00Z");
              let run = create_run(&store, "approval-restart", json!([]), json!([]));
              request_approval(&store, &run, "node-z");
              let queue = store
                  .operator_decision_queue("2026-07-11T00:00:00Z", 300, 100, 0)
                  .unwrap();
              let item = item_for_action(&queue, OperatorDecisionAction::Approve);
              drop(store);
              clock.set("2026-07-11T00:00:10Z");
              let clock_owner = clock.clone();
              let reopened =
                  LocalProductStore::new_with_clock(&path, move || clock_owner.now()).unwrap();
              let app = build_axum_router(AxumApiState::new().with_local_store(reopened));
              let (status, response) = post_action(
                  app,
                  &item.decision_id,
                  action_body(&queue, OperatorDecisionAction::Approve, &queue.generated_at),
              )
              .await;
              assert_eq!(status, StatusCode::OK, "{response}");
          }

          #[tokio::test]
          async fn unsupported_actions_are_explicitly_rejected() {
              let (_directory, _path, app, queue, item) =
                  approval_fixture("2026-07-11T00:00:00Z", "2026-07-11T00:00:10Z");
              let (status, body) = post_action(
                  app,
                  &item.decision_id,
                  action_body(&queue, OperatorDecisionAction::Rollback, &queue.generated_at),
              )
              .await;
              assert_eq!(status, StatusCode::CONFLICT);
              assert_eq!(
                  body["error"]["code"],
                  "operator_decision_action_not_allowlisted"
              );
          }
          '''
          tests.write_text(text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/storage/local_product_store/workflow_runs.rs \
                  engine/src/http_server/handlers/operator_decision_actions.rs \
                  engine/tests/test_pe3_operator_action_repair.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PE3-REPAIR-1 bind atomic approval owner and concurrency tests"
          git push origin HEAD:${{ github.head_ref }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Build local Docker services
        run: |
          success=0
          for i in 1 2 3; do
            if docker compose build; then
              success=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          if [ "$success" -ne 1 ]; then
            echo "All 3 docker compose build attempts failed"
            exit 1
          fi
