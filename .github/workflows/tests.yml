      - name: Report documentation-only lane
        if: needs.classify-change-impact.outputs.docs_only == 'true'
        run: echo "rust-typescript-cutover not applicable to a trusted documentation-only diff"
      - name: Install bubblewrap for Codex mediation isolation probes
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          test -x /usr/bin/bwrap
      - name: Install Rust toolchain
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up sccache
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.15.0"
          disable_annotations: true
      - name: Cache Cargo registry and Git dependencies
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-rust-deps-2026-07-10-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-2026-07-10-
      - name: Set up Bun
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache Bun downloads
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('sdk/typescript/bun.lock', 'dashboard/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Set up uv
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      - name: Verify Rust + TypeScript stack
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        run: bash scripts/verify_rust_typescript_stack.sh
      - name: Report sccache statistics
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        continue-on-error: true
        run: '"${SCCACHE_PATH}" --show-stats'

  docker-build:
    needs: classify-change-impact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to run without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Report documentation-only lane
        if: needs.classify-change-impact.outputs.docs_only == 'true'
        run: echo "docker-build not applicable to a trusted documentation-only diff"
      - name: Build local Docker services
        if: needs.classify-change-impact.outputs.docs_only != 'true'
        run: |
          success=0
          for i in 1 2 3; do
            if docker compose build; then
              success=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          test "$success" -eq 1

  context-capsule:
    name: context-capsule
    needs:
      - python-tests
      - rust-tests
      - pg-integration-tests
      - typescript-tests
      - native-runtime
      - docker-build
      - rust-typescript-cutover
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      NEEDS_CONTEXT_PATH: ${{ runner.temp }}/needs-context.json
      CAPSULE_DIR: ${{ runner.temp }}/context-capsule
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to publish a context capsule without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Check out trusted exact-head verifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Verify live PR head with trusted base action
        if: github.event_name == 'pull_request'
        uses: ./trusted-base/actions/exact-head-check
        with:
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number }}
          expected-head: ${{ env.EXPECTED_SHA }}
          allow-fork-head: "true"
          proof-path: trusted-exact-head-proof.json
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      - name: Convert needs context to source-check JSON
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          json.dump(
              json.loads(os.environ["NEEDS_JSON"]),
              open(os.environ["NEEDS_CONTEXT_PATH"], "w", encoding="utf-8"),
              sort_keys=True,
          )
          PY
      - name: Generate context capsule
        run: |
          set -euo pipefail
          mkdir -p "${CAPSULE_DIR}"
          args=(
            --format json
            --checks-json "$(cat "${NEEDS_CONTEXT_PATH}")"
            --event-name "${GITHUB_EVENT_NAME}"
          )
          if [ -n "${GITHUB_PR_NUMBER}" ]; then
            args+=(
              --pr-number "${GITHUB_PR_NUMBER}"
              --expected-head-sha "${EXPECTED_SHA}"
              --exact-head-proof trusted-exact-head-proof.json
            )
          fi
          env -u GH_TOKEN -u GITHUB_TOKEN \
            uv run --no-project python scripts/project_context.py "${args[@]}" \
            > "${CAPSULE_DIR}/context-capsule.json"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            uv run --no-project python scripts/project_context.py \
            --format markdown \
            --capsule-json "${CAPSULE_DIR}/context-capsule.json" \
            > "${CAPSULE_DIR}/context-capsule.md"
      - name: Publish sanitized job summary
        run: |
          echo '## Context Capsule' >> "$GITHUB_STEP_SUMMARY"
          head -c 100000 "${CAPSULE_DIR}/context-capsule.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload context capsule artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: context-capsule-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/context-capsule/
          retention-days: 1
          if-no-files-found: error
      - name: Validate source-check matrix is fully successful
        run: |
          uv run --no-project python scripts/project_context.py \
            --format json \
            --capsule-json "${CAPSULE_DIR}/context-capsule.json" \
            --require-success \
            > /dev/null
