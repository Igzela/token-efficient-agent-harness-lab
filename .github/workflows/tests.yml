name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Check wire codegen drift
        run: bash scripts/check_wire_codegen_drift.sh
      - name: Check GitHub Action pins
        run: bash scripts/check_github_action_pins.sh
      - name: Run security baseline checker
        run: uv run --no-project python tools/check_security_baseline.py
      - name: Run relocated utility tests
        run: uv run --no-project python -m unittest discover -s tools -p "test_*.py"
      - name: Run Python SDK tests
        run: cd sdk/python && PYTHONPATH=src uv run --no-project python -m unittest discover -s tests

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Run cargo test
        run: cargo test -p engine
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings
      - name: Audit Rust dependencies
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit --deny warnings

  pg-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      ACP_TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Run PostgreSQL integration tests
        run: cargo test -p engine --features pg-tests -- --test-threads=1

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install SDK dependencies
        run: cd sdk/typescript && bun install --frozen-lockfile
      - name: Run SDK tests
        run: cd sdk/typescript && bun run test
      - name: Build SDK package
        run: cd sdk/typescript && bun run build
      - name: Audit SDK dependencies
        run: cd sdk/typescript && bun audit
      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile
      - name: Check dashboard
        run: cd dashboard && bun run lint && bun run typecheck && bun run build
      - name: Audit dashboard dependencies
        run: cd dashboard && bun audit

  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Build static dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build:static
      - name: Build native engine
        run: cargo build -p engine
      - name: Smoke native runtime
        run: uv run --no-project python scripts/smoke_native_runtime.py
      - name: Smoke adaptive stub completion
        run: bash scripts/smoke_adaptive_stub_completion.sh

  rust-typescript-cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Verify Rust + TypeScript stack
        run: bash scripts/verify_rust_typescript_stack.sh

  pe3-terminal-resume-apply:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: rustfmt
      - name: Apply bounded source and test repair
        run: |
          python - <<'PY'
          from pathlib import Path

          queue = Path('engine/src/storage/local_product_store/operator_decision_queue/mod.rs')
          text = queue.read_text()
          start_marker = '                let budget_decision = pause_reason.strip_prefix("budget_auto_pause:");\n'
          end_marker = '            } else if status == "blocked" {\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('terminal resume source boundaries missing')
          replacement = '''                let budget_decision = pause_reason.strip_prefix("budget_auto_pause:");
                  let terminal = matches!(status, "failed" | "completed" | "cancelled");
                  let (kind, source_id, active_reason, terminal_reason, evidence_references) =
                      if let Some(decision_id) = budget_decision {
                          (
                              OperatorDecisionSourceKind::Recovery,
                              decision_id.to_string(),
                              "budget_pause_recovery_required",
                              "budget_pause_terminal",
                              vec![original_reference(
                                  "budget_pause_decision",
                                  decision_id,
                                  None,
                              )],
                          )
                      } else {
                          (
                              OperatorDecisionSourceKind::Workflow,
                              format!("workflow-pause-{run_id}"),
                              "workflow_paused",
                              "workflow_pause_terminal",
                              vec![workflow_ref.clone()],
                          )
                      };
                  push_source(
                      sources,
                      SourceInput {
                          kind,
                          id: source_id,
                          resource: run_id.clone(),
                          conflict_key: format!("{run_id}:control"),
                          action: OperatorDecisionAction::Resume,
                          state: if terminal {
                              OperatorDecisionSourceState::Resolved
                          } else {
                              OperatorDecisionSourceState::Actionable
                          },
                          severity: if terminal {
                              OperatorDecisionSeverity::Info
                          } else {
                              OperatorDecisionSeverity::Warning
                          },
                          confidence: 1.0,
                          observed_at,
                          expires_at: None,
                          reason: if terminal { terminal_reason } else { active_reason },
                          evidence_references,
                      },
                  )?;
'''
          queue.write_text(text[:start] + replacement + text[end:])

          tests = Path('engine/tests/test_pe3_operator_action_repair.rs')
          test_text = tests.read_text()
          if 'fn terminal_paused_runs_do_not_recommend_resume()' not in test_text:
              test_text += r'''

          #[test]
          fn terminal_paused_runs_do_not_recommend_resume() {
              let directory = tempdir().unwrap();
              let path = directory.path().join("local.db");
              let (store, _clock) = make_store(&path, "2026-07-11T00:00:00Z");
              for status in ["failed", "completed", "cancelled"] {
                  let run = create_run(&store, status, json!([]), json!([]));
                  let connection = rusqlite::Connection::open(&path).unwrap();
                  connection
                      .execute(
                          "UPDATE workflow_runs SET status = ?1, pause_reason = 'manual', updated_at = ?2 WHERE run_id = ?3",
                          rusqlite::params![status, "2026-07-11T00:00:00Z", run],
                      )
                      .unwrap();
              }
              let queue = store
                  .operator_decision_queue("2026-07-11T00:00:00Z", 300, 100, 0)
                  .unwrap();
              assert!(queue.items.iter().all(|item| {
                  item.recommended_action != Some(OperatorDecisionAction::Resume)
              }));
          }
          '''
          if 'fn inspect_and_acknowledge_are_explicitly_rejected()' not in test_text:
              test_text += r'''

          #[tokio::test]
          async fn inspect_and_acknowledge_are_explicitly_rejected() {
              let (_directory, _path, app, queue, item) =
                  approval_fixture("2026-07-11T00:00:00Z", "2026-07-11T00:00:10Z");
              for action in [
                  OperatorDecisionAction::Inspect,
                  OperatorDecisionAction::Acknowledge,
              ] {
                  let (status, body) = post_action(
                      app.clone(),
                      &item.decision_id,
                      action_body(&queue, action, &queue.generated_at),
                  )
                  .await;
                  assert_eq!(status, StatusCode::CONFLICT);
                  assert_eq!(body["code"], "operator_decision_action_not_allowlisted");
              }
          }
          '''
          tests.write_text(test_text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/storage/local_product_store/operator_decision_queue/mod.rs \
                  engine/tests/test_pe3_operator_action_repair.rs
          git commit -m "PE3-REPAIR-1 suppress terminal resume and cover unsupported actions"
          git push origin HEAD:${{ github.head_ref }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Build local Docker services
        run: |
          success=0
          for i in 1 2 3; do
            if docker compose build; then
              success=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          if [ "$success" -ne 1 ]; then
            echo "All 3 docker compose build attempts failed"
            exit 1
          fi
