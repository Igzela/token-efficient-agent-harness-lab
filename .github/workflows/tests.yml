  context-capsule:
    name: context-capsule
    needs:
      - classify-change-impact
      - python-tests
      - rust-tests
      - pg-integration-tests
      - typescript-tests
      - native-runtime
      - docker-build
      - rust-typescript-cutover
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      REUSE_MODE: ${{ needs.classify-change-impact.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to publish a context capsule without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Check out trusted exact-head verifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Verify live PR head with trusted base action
        if: github.event_name == 'pull_request'
        uses: ./trusted-base/actions/exact-head-check
        with:
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number }}
          expected-head: ${{ env.EXPECTED_SHA }}
          allow-fork-head: "true"
          proof-path: trusted-exact-head-proof.json
      - name: Check out trusted main-reuse verifier
        if: github.event_name == 'push' && env.REUSE_MODE == 'reused_pr'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.before }}
          path: trusted-reuse
          persist-credentials: false
      - name: Download main CI reuse receipt
        if: github.event_name == 'push' && env.REUSE_MODE == 'reused_pr'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: main-ci-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-ci-reuse
      - name: Revalidate trusted main CI reuse receipt
        if: github.event_name == 'push' && env.REUSE_MODE == 'reused_pr'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 trusted-reuse/scripts/ci/main_reuse_evidence.py \
            --repository "${GITHUB_REPOSITORY}" \
            --before "${{ github.event.before }}" \
            --after "${EXPECTED_SHA}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --receipt "${RUNNER_TEMP}/main-ci-reuse-recomputed.json"
          cmp \
            "${RUNNER_TEMP}/main-ci-reuse/main-ci-reuse.json" \
            "${RUNNER_TEMP}/main-ci-reuse-recomputed.json"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      - name: Convert needs context to source-check JSON
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os

          json.dump(
              json.loads(os.environ["NEEDS_JSON"]),
              open("needs-context.json", "w", encoding="utf-8"),
              sort_keys=True,
          )
          PY
      - name: Generate context capsule
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p context-capsule
          args=(
            --format json
            --checks-json "$(cat needs-context.json)"
            --event-name "${GITHUB_EVENT_NAME}"
          )
          if [ -n "${GITHUB_PR_NUMBER}" ]; then
            cp "${GITHUB_WORKSPACE}/trusted-exact-head-proof.json" trusted-exact-head-proof.json
            args+=(
              --pr-number "${GITHUB_PR_NUMBER}"
              --expected-head-sha "${EXPECTED_SHA}"
              --exact-head-proof trusted-exact-head-proof.json
            )
          else
            expected_head_option="--expected-head-sha"
            args+=("${expected_head_option}" "${EXPECTED_SHA}")
          fi
          env -u GH_TOKEN -u GITHUB_TOKEN \
            uv run --no-project python "${GITHUB_WORKSPACE}/scripts/project_context.py" "${args[@]}" \
            > context-capsule/context-capsule.json
          env -u GH_TOKEN -u GITHUB_TOKEN \
            uv run --no-project python "${GITHUB_WORKSPACE}/scripts/project_context.py" \
            --format markdown \
            --capsule-json context-capsule/context-capsule.json \
            > context-capsule/context-capsule.md
          if [ "${REUSE_MODE}" = "reused_pr" ]; then
            cp "${RUNNER_TEMP}/main-ci-reuse-recomputed.json" \
              context-capsule/main-ci-reuse.json
          fi
      - name: Publish sanitized job summary
        working-directory: ${{ runner.temp }}
        run: |
          echo '## Context Capsule' >> "$GITHUB_STEP_SUMMARY"
          head -c 100000 context-capsule/context-capsule.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload context capsule artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: context-capsule-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/context-capsule/
          retention-days: 1
          if-no-files-found: error
      - name: Validate source-check matrix is fully successful
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project python "${GITHUB_WORKSPACE}/scripts/project_context.py" \
            --format json \
            --capsule-json context-capsule/context-capsule.json \
            --require-success \
            > /dev/null
