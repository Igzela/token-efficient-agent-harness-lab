  rust-typescript-cutover:
    needs:
      - classify-change-impact
      - native-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact requested head
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "EXPECTED_SHA is empty; refusing to run without an exact head"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "HEAD ${actual} does not match EXPECTED_SHA ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Report documentation-only lane
        if: needs.classify-change-impact.outputs.docs_only == 'true'
        run: echo "rust-typescript-cutover not applicable to a trusted documentation-only diff"
      - name: Report accepted PR reuse lane
        if: needs.classify-change-impact.outputs.mode == 'reused_pr'
        run: echo "rust-typescript-cutover reused from the accepted tree-identical PR head"
      - name: Download Rust + TypeScript cutover evidence
        if: needs.classify-change-impact.outputs.mode == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-typescript-cutover-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/rust-typescript-cutover
      - name: Validate Rust + TypeScript cutover evidence
        if: needs.classify-change-impact.outputs.mode == 'full'
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/rust-typescript-cutover/rust-typescript-cutover.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["EVIDENCE_PATH"], encoding="utf-8") as handle:
              evidence = json.load(handle)
          expected = {
              "schema_version": "rust_typescript_cutover.v1",
              "head_sha": os.environ["EXPECTED_SHA"],
              "provider_execution": "disabled",
              "runtime_smoke": "success",
          }
          for field, value in expected.items():
              if evidence.get(field) != value:
                  raise SystemExit(f"cutover evidence {field} mismatch")
          for field in ("engine_sha256", "dashboard_index_sha256"):
              if not re.fullmatch(r"[0-9a-f]{64}", str(evidence.get(field) or "")):
                  raise SystemExit(f"cutover evidence {field} invalid")
          PY

