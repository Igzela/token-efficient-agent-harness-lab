name: agent-worker

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: number
      dry_run:
        description: Read-only validation plan; never invokes Codex or mutates GitHub state
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: agent-worker-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.control.outputs.enabled }}
      dry_run: ${{ steps.control.outputs.dry_run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Read live control Issue
        id: control
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif python3 scripts/agent-control/control_state.py require-live >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  dry-run:
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Emit mutation-free dry-run plan
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          print(json.dumps({"mode": "dry-run", "mutations": [], "codex": False, "artifact": False}, sort_keys=True))
          PY

  validate:
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      can_start: ${{ steps.claim.outputs.can_start }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Verify live control and dispatcher claim
        id: claim
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! python3 scripts/agent-control/control_state.py require-live >/dev/null; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python3 scripts/agent-control/state_manager.py validate-scope "${{ inputs.issue }}" >/dev/null; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "invalid Issue scope; no Vader worker will start"
            exit 0
          fi
          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "${{ inputs.issue }}")
          if echo "$LABELS" | grep -qw agent-running && ! echo "$LABELS" | grep -Eq '(ci-repairing|review-running|agent-complete|agent-blocked)'; then
            echo "can_start=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_start=false" >> "$GITHUB_OUTPUT"
          fi

  vader-implementation:
    needs: validate
    if: needs.validate.outputs.can_start == 'true'
    runs-on: [self-hosted, vader, agent-worker]
    permissions:
      actions: write
      contents: read
      issues: read
    outputs:
      base_sha: ${{ steps.worktree.outputs.base_sha }}
      expected_remote_sha: ${{ steps.worktree.outputs.expected_remote_sha }}
      branch: ${{ steps.worktree.outputs.branch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Create isolated worktree
        id: worktree
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/agent-control/worktree_manager.py create "${{ inputs.issue }}" "agent/issue-${{ inputs.issue }}")
          WORKTREE=$(jq -er '.worktree_path' <<<"$RESULT")
          BASE=$(jq -er '.base_sha' <<<"$RESULT")
          REMOTE=$(jq -r '.previous_remote_sha // ""' <<<"$RESULT")
          test -d "$WORKTREE"
          {
            echo "worktree_path=$WORKTREE"
            echo "base_sha=$BASE"
            echo "expected_remote_sha=$REMOTE"
            echo "branch=agent/issue-${{ inputs.issue }}"
          } >> "$GITHUB_OUTPUT"
      - name: Build trusted implementation prompt
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/prompt_builder.py implementation "${{ inputs.issue }}" > "$RUNNER_TEMP/implementation-prompt.txt"
      - name: Recheck control immediately before Codex
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Run Codex in worktree with no GitHub credentials
        run: |
          bash scripts/agent-control/codex_wrapper.sh implement "$RUNNER_TEMP/implementation-prompt.txt" \
            "$RUNNER_TEMP/codex-output" "${{ steps.worktree.outputs.worktree_path }}"
      - name: Recheck control before accepting Codex output and creating artifact
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          cd "${{ steps.worktree.outputs.worktree_path }}"
          git diff --check
          python3 "$GITHUB_WORKSPACE/scripts/agent-control/artifact_contract.py" create implementation \
            "${{ inputs.issue }}" 0 "${{ steps.worktree.outputs.base_sha }}" \
            "${{ steps.worktree.outputs.expected_remote_sha }}" "${{ steps.worktree.outputs.branch }}" \
            "$(cat "$RUNNER_TEMP/codex-output/codex-exit-code.txt")" \
            '[{"command":"git diff --check","exit_code":0}]' "$RUNNER_TEMP/agent-artifact"
      - name: Recheck control immediately before artifact upload
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Upload untrusted implementation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: implementation-${{ github.run_id }}-${{ inputs.issue }}
          path: ${{ runner.temp }}/agent-artifact
          if-no-files-found: error
          retention-days: 1
      - name: Release secondary worktree lock and remove worktree
        if: always()
        run: python3 scripts/agent-control/worktree_manager.py remove "${{ inputs.issue }}" "agent/issue-${{ inputs.issue }}"

  finalize:
    needs: vader-implementation
    if: needs.vader-implementation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.commit.outputs.head_sha }}
    env:
      AGENT_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Download untrusted implementation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: implementation-${{ github.run_id }}-${{ inputs.issue }}
          path: ${{ runner.temp }}/agent-artifact
      - name: Validate bindings, remote head, and untrusted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.vader-implementation.outputs.base_sha }}
          EXPECTED_REMOTE_SHA: ${{ needs.vader-implementation.outputs.expected_remote_sha }}
          BRANCH: ${{ needs.vader-implementation.outputs.branch }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          ACTUAL_REMOTE=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$ACTUAL_REMOTE" = "$EXPECTED_REMOTE_SHA"
          python3 scripts/agent-control/artifact_contract.py validate implementation "${{ inputs.issue }}" 0 \
            "$BASE_SHA" "$EXPECTED_REMOTE_SHA" "$BRANCH" "$RUNNER_TEMP/agent-artifact"
          gh issue view "${{ inputs.issue }}" --json body --jq .body > "$RUNNER_TEMP/task-issue-body.md"
          python3 scripts/agent-control/artifact_contract.py validate-scope "$RUNNER_TEMP/task-issue-body.md" \
            "$RUNNER_TEMP/agent-artifact/agent-result.json"
      - name: Recheck control immediately before applying implementation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Apply patch to clean exact base checkout and recompute paths
        env:
          BASE_SHA: ${{ needs.vader-implementation.outputs.base_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          git apply --index --binary "$RUNNER_TEMP/agent-artifact/agent.patch"
          python3 scripts/agent-control/artifact_contract.py validate-index "$RUNNER_TEMP/agent-artifact/agent-result.json"
          git diff --cached --check
      - name: Recheck control immediately before commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Commit validated patch
        id: commit
        run: |
          git config user.name "agent-orchestrator[bot]"
          git config user.email "agent-orchestrator[bot]@users.noreply.github.com"
          git commit -m "agent: implement #${{ inputs.issue }}"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Recheck control immediately before push
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Push branch with isolated temporary credentials
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          BRANCH: ${{ needs.vader-implementation.outputs.branch }}
          EXPECTED_REMOTE_SHA: ${{ needs.vader-implementation.outputs.expected_remote_sha }}
        run: |
          set -euo pipefail
          test -n "${AGENT_PUSH_TOKEN:-}" || { echo "FATAL: AGENT_PUSH_TOKEN is missing" >&2; exit 1; }
          AUTH_DIR="$RUNNER_TEMP/agent-push-auth"
          mkdir -p "$AUTH_DIR"
          trap 'rm -rf "$AUTH_DIR"' EXIT
          cat > "$AUTH_DIR/askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s' x-access-token ;;
            *) printf '%s' "$AGENT_PUSH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$AUTH_DIR/askpass"
          GIT_ASKPASS="$AUTH_DIR/askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= -c credential.useHttpPath=true \
            push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_REMOTE_SHA" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
      - name: Recheck control immediately before PR creation or update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-control/control_state.py require-live >/dev/null
      - name: Create or update Issue-bound PR using github.token
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.vader-implementation.outputs.branch }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          BODY_FILE="$RUNNER_TEMP/agent-pr-body.md"
          printf 'Closes #%s\n\n<!-- agent-orchestrator-binding: {"issue_number": %s, "branch": "%s"} -->\n' \
            "${{ inputs.issue }}" "${{ inputs.issue }}" "$BRANCH" > "$BODY_FILE"
          PR_JSON=$(python3 scripts/agent-control/pr_binding.py create-or-update \
            "${{ inputs.issue }}" "$BRANCH" "$(git rev-parse HEAD)" \
            "agent: implement #${{ inputs.issue }}" "$BODY_FILE")
          PR_NUMBER=$(jq -er '.number' <<<"$PR_JSON")
          test "$PR_NUMBER" -gt 0
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Persist worker state with github.token
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.vader-implementation.outputs.branch }}
        run: |
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/state_manager.py record-worker "${{ inputs.issue }}" "${{ steps.pr.outputs.pr_number }}" \
            "${{ steps.commit.outputs.head_sha }}" implementation "{\"branch\":\"$BRANCH\"}"
      - name: Recheck control immediately before exact-head CI dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.vader-implementation.outputs.branch }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          EXISTING=$(python3 scripts/agent-control/state_manager.py read-ci-acquisition "${{ inputs.issue }}" \
            "${{ steps.pr.outputs.pr_number }}" "${{ steps.commit.outputs.head_sha }}")
          if [ "$EXISTING" != "null" ]; then
            CI="$EXISTING"
          else
            python3 scripts/agent-control/control_state.py require-live >/dev/null
            CI=$(python3 scripts/agent-control/ci_verifier.py acquire "${{ steps.pr.outputs.pr_number }}" "$BRANCH" "${{ steps.commit.outputs.head_sha }}")
          fi
          RUN_ID=$(jq -er '.workflow_run_id' <<<"$CI")
          if [ "$EXISTING" = "null" ]; then
            SOURCE=$(jq -er '.source' <<<"$CI")
            DUPLICATES=$(jq -c '.duplicate_run_ids // []' <<<"$CI")
            python3 scripts/agent-control/state_manager.py record-ci-acquisition "${{ inputs.issue }}" \
              "${{ steps.pr.outputs.pr_number }}" "${{ steps.commit.outputs.head_sha }}" "$RUN_ID" "$SOURCE" "$DUPLICATES"
          fi
          EXTRA=$(jq -c --argjson id "$RUN_ID" '{workflow_name,required_jobs,successful_jobs:[],workflow_run_id:$id}' scripts/agent-control/ci_requirements.json)
          python3 scripts/agent-control/state_manager.py record-ci "${{ inputs.issue }}" "${{ steps.pr.outputs.pr_number }}" \
            "${{ steps.commit.outputs.head_sha }}" "$RUN_ID" dispatched "$EXTRA"

  rejected-before-vader:
    needs: [gate, validate]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Release a successfully rejected dispatcher claim
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GATE_ENABLED: ${{ needs.gate.outputs.enabled }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CAN_START: ${{ needs.validate.outputs.can_start }}
        run: |
          python3 scripts/agent-control/state_manager.py release-rejected-worker \
            "${{ inputs.issue }}" "$GATE_ENABLED" "$VALIDATE_RESULT" "$CAN_START"

  failure-handler:
    needs: [gate, validate, vader-implementation, finalize]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Release only the failed worker's active capacity
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/state_manager.py release-failed \
            "${{ inputs.issue }}" agent-running agent-blocked
