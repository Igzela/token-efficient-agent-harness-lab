name: agent-worker

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: number
      dry_run:
        description: Validate without invoking Codex or pushing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-worker-${{ github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.can_start }}
      emergency_stopped: ${{ steps.check.outputs.emergency_stopped }}
    steps:
      - name: Check orchestrator gate and emergency stop
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Worker disabled."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "Emergency stop is active. Worker disabled."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "emergency_stopped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_start=true" >> "$GITHUB_OUTPUT"
          echo "emergency_stopped=false" >> "$GITHUB_OUTPUT"

  validate:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      can_start: ${{ steps.check.outputs.can_start }}
      worker_count: ${{ steps.check.outputs.worker_count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Validate issue state and capacity
        id: check
        run: |
          ISSUE=${{ github.event.inputs.issue }}

          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "$ISSUE")
          if echo "$LABELS" | grep -qv "agent-ready"; then
            echo "Issue #$ISSUE does not have agent-ready label."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -Eq "(agent-running|ci-repairing|review-running|agent-complete|agent-blocked)"; then
            echo "Issue #$ISSUE is already active or terminal ($LABELS)."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python3 scripts/agent-control/state_manager.py check-deps "$ISSUE"; then
            echo "Issue #$ISSUE has unresolved dependencies."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPACITY=$(python3 scripts/agent-control/lock_manager.py capacity 2>&1 || echo "full")
          WORKERS=$(python3 scripts/agent-control/lock_manager.py count)
          if [ "$CAPACITY" = "full" ]; then
            echo "Repository capacity full ($WORKERS active workers)."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "worker_count=$WORKERS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_start=true" >> "$GITHUB_OUTPUT"
          echo "worker_count=$WORKERS" >> "$GITHUB_OUTPUT"

  implement:
    needs: [gate, validate]
    if: needs.validate.outputs.can_start == 'true'
    runs-on: [self-hosted, vader, agent-worker]
    outputs:
      pr_number: ${{ steps.push.outputs.pr_number }}
      head_sha: ${{ steps.push.outputs.head_sha }}
      branch: ${{ steps.worktree.outputs.branch }}
      worktree_path: ${{ steps.worktree.outputs.worktree_path }}
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "agent-orchestrator[bot]"
          git config user.email "agent-orchestrator[bot]@users.noreply.github.com"

      - name: Acquire lock
        id: lock
        run: |
          python3 scripts/agent-control/lock_manager.py acquire "implementation:issue-${{ github.event.inputs.issue }}" 60
          echo "lock_key=implementation:issue-${{ github.event.inputs.issue }}" >> "$GITHUB_OUTPUT"

      - name: Mark agent-running
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-running

      - name: Create isolated worktree
        id: worktree
        run: |
          ISSUE=${{ github.event.inputs.issue }}
          BRANCH="agent/issue-$ISSUE"

          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: Worker Starting
          Branch: \`$BRANCH\`
          Creating isolated worktree for implementation."

          python3 scripts/agent-control/worktree_manager.py create "$ISSUE" "$BRANCH"
          WORKTREE_PATH=$(python3 scripts/agent-control/worktree_manager.py create "$ISSUE" "$BRANCH" 2>/dev/null | grep "worktree=" | cut -d= -f2)

          if [ -z "$WORKTREE_PATH" ]; then
            echo "ERROR: Failed to create worktree"
            exit 1
          fi

          echo "worktree_path=$WORKTREE_PATH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build implementation prompt
        id: prompt
        run: |
          mkdir -p /tmp/agent-prompt
          python3 scripts/agent-control/prompt_builder.py implementation \
            ${{ github.event.inputs.issue }} > /tmp/agent-prompt/issue-${{ github.event.inputs.issue }}.txt

      - name: Run Codex (implementation worker)
        if: github.event.inputs.dry_run != 'true'
        id: codex
        run: |
          bash scripts/agent-control/codex_wrapper.sh \
            implement \
            /tmp/agent-prompt/issue-${{ github.event.inputs.issue }}.txt \
            /tmp/agent-output/${{ github.event.inputs.issue }} \
            "${{ steps.worktree.outputs.worktree_path }}"
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}

      - name: Verify Codex produced changes
        if: github.event.inputs.dry_run != 'true'
        id: changes
        run: |
          cd "${{ steps.worktree.outputs.worktree_path }}"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex produced no changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit (orchestrator-owned)
        if: github.event.inputs.dry_run != 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          cd "${{ steps.worktree.outputs.worktree_path }}"
          git add -A
          git diff --cached --quiet || git commit -m "agent: implement #${{ github.event.inputs.issue }}"
          echo "Committed changes in worktree"

      - name: Push branch
        if: github.event.inputs.dry_run != 'true' && steps.changes.outputs.has_changes == 'true'
        id: push
        run: |
          ISSUE=${{ github.event.inputs.issue }}
          BRANCH="${{ steps.worktree.outputs.branch }}"
          cd "${{ steps.worktree.outputs.worktree_path }}"

          python3 scripts/agent-control/worktree_manager.py push "$BRANCH"

          PR_INFO=$(python3 scripts/agent-control/worktree_manager.py create-pr "$ISSUE" "$BRANCH" \
            "agent: implement #$ISSUE" \
            "Implements #$ISSUE" 2>&1)

          PR_NUMBER=$(echo "$PR_INFO" | grep "pr_number=" | cut -d= -f2)
          HEAD_SHA=$(git rev-parse HEAD)

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          python3 scripts/agent-control/state_manager.py record-worker \
            "$ISSUE" "$PR_NUMBER" "$HEAD_SHA" "implementation"

          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: Implementation Complete
          PR: #$PR_NUMBER
          Branch: \`$BRANCH\`
          Head SHA: \`$HEAD_SHA\`
          Waiting for CI to complete before final review."

      - name: Dry-run report
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "=== Dry-Run Worker Report ==="
          echo "Issue: ${{ github.event.inputs.issue }}"
          echo "Worktree: ${{ steps.worktree.outputs.worktree_path }}"
          echo "Branch: ${{ steps.worktree.outputs.branch }}"
          echo "Codex invocation: SKIPPED"
          echo "Branch push: SKIPPED"
          echo "PR creation: SKIPPED"

      - name: Release lock
        if: always()
        run: |
          python3 scripts/agent-control/lock_manager.py release \
            "implementation:issue-${{ github.event.inputs.issue }}" || true

  failure-handler:
    needs: implement
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Mark blocked on failure
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-blocked
          python3 scripts/agent-control/state_manager.py comment \
            ${{ github.event.inputs.issue }} \
            "## Agent Orchestrator: Worker Failed
          The implementation worker encountered an error.
          This task has been marked \`agent-blocked\`."
