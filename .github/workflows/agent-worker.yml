name: agent-worker

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: number
      dry_run:
        description: Validate without invoking Codex or pushing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-worker-${{ github.event.inputs.issue }}
  cancel-in-progress: false

env:
  AGENT_REPO: ${{ github.repository }}
  AGENT_WORKTREE_BASE: /tmp/agent-worktrees

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      can_start: ${{ steps.check.outputs.can_start }}
      worker_count: ${{ steps.check.outputs.worker_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Validate issue state
        id: check
        run: |
          ISSUE=${{ github.event.inputs.issue }}

          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Worker disabled."
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "$ISSUE")
          if echo "$LABELS" | grep -qv "agent-ready"; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -Eq "(agent-running|ci-repairing|final-review|agent-complete|agent-blocked)"; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python3 scripts/agent-control/state_manager.py check-deps "$ISSUE"; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPACITY=$(python3 scripts/agent-control/lock_manager.py capacity 2>&1 || echo "full")
          WORKERS=$(python3 scripts/agent-control/lock_manager.py count)
          if [ "$CAPACITY" = "full" ]; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "worker_count=$WORKERS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_start=true" >> "$GITHUB_OUTPUT"
          echo "worker_count=$WORKERS" >> "$GITHUB_OUTPUT"
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}

  implement:
    needs: validate
    if: needs.validate.outputs.can_start == 'true'
    runs-on: [self-hosted, vader, agent-worker]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Configure git authentication
        run: |
          gh auth setup-git
          git config user.name "agent-orchestrator[bot]"
          git config user.email "agent-orchestrator[bot]@users.noreply.github.com"

      - name: Acquire lock
        id: lock
        run: |
          python3 scripts/agent-control/lock_manager.py acquire "implementation:issue-${{ github.event.inputs.issue }}" 60
          echo "lock_key=implementation:issue-${{ github.event.inputs.issue }}" >> "$GITHUB_OUTPUT"

      - name: Mark agent-running
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-running

      - name: Build implementation prompt
        id: prompt
        run: |
          mkdir -p /tmp/agent-prompt
          python3 scripts/agent-control/prompt_builder.py implementation \
            ${{ github.event.inputs.issue }} > /tmp/agent-prompt/issue-${{ github.event.inputs.issue }}.txt

      - name: Run Codex (implementation worker)
        if: github.event.inputs.dry_run != 'true'
        id: codex
        run: |
          bash scripts/agent-control/codex_wrapper.sh \
            implement \
            /tmp/agent-prompt/issue-${{ github.event.inputs.issue }}.txt \
            /tmp/agent-output/${{ github.event.inputs.issue }}
        env:
          AGENT_ORCHESTRATOR_ENABLED: "true"

      - name: Push branch and create PR
        if: github.event.inputs.dry_run != 'true'
        id: pr
        run: |
          ISSUE=${{ github.event.inputs.issue }}
          BRANCH="agent/issue-$ISSUE"

          # Recheck remote head before push
          git fetch origin "$BRANCH" 2>/dev/null || true
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "origin/$BRANCH" 2>/dev/null || echo "")
          if [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
            echo "ERROR: Remote head changed. Expected $LOCAL, got $REMOTE"
            exit 1
          fi

          git add -A
          git diff --cached --quiet || git commit -m "agent: implement #$ISSUE"
          python3 scripts/agent-control/worktree_manager.py push "$BRANCH"
          python3 scripts/agent-control/worktree_manager.py create-pr "$ISSUE" "$BRANCH"

      - name: Record worker state
        run: |
          ISSUE=${{ github.event.inputs.issue }}
          PR_NUMBER=$(gh pr list --head "agent/issue-$ISSUE" --json number --jq '.[0].number' 2>/dev/null || echo "0")
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "unknown")
          python3 scripts/agent-control/state_manager.py record-worker \
            "$ISSUE" "$PR_NUMBER" "$HEAD_SHA" "implementation"

      - name: Comment on issue
        run: |
          ISSUE=${{ github.event.inputs.issue }}
          PR_NUMBER=$(gh pr list --head "agent/issue-$ISSUE" --json number --jq '.[0].number' 2>/dev/null || echo "0")
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "unknown")
          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: Implementation Complete
          PR: #${PR_NUMBER}
          Branch: \`agent/issue-${ISSUE}\`
          Head SHA: \`${HEAD_SHA}\`
          Waiting for CI to complete before final review."

      - name: Dry-run report
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "=== Dry-Run Worker Report ==="
          echo "Issue: ${{ github.event.inputs.issue }}"
          echo "Codex invocation: SKIPPED"
          echo "Branch push: SKIPPED"
          echo "PR creation: SKIPPED"

      - name: Release lock
        if: always()
        run: |
          python3 scripts/agent-control/lock_manager.py release \
            "implementation:issue-${{ github.event.inputs.issue }}" || true

  failure-handler:
    needs: implement
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Mark blocked on failure
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-blocked
          python3 scripts/agent-control/state_manager.py comment \
            ${{ github.event.inputs.issue }} \
            "## Agent Orchestrator: Worker Failed
          The implementation worker encountered an error.
          This task has been marked \`agent-blocked\`."
