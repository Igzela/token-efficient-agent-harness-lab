name: prepare-ci-main-docs-lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: prepare-ci-main-docs-lane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'agent/ci-main-docs-lane-guard-1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/ci-main-docs-lane-guard-1
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
      - name: Apply bounded CI optimization
        run: |
          set -euo pipefail
          git show 8044f963ee2b6b5752cd084ada6d4860881c3786:.github/workflows/pr-fast-checks.yml > .github/workflows/pr-fast-checks.yml
          python3 .github/ci/prepare_ci_main_docs_lane.py
      - name: Validate generated result
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml python -m unittest tools.test_ci_workflow_optimization tools.test_ci_lane_contract -v
          uv run --no-project --with pyyaml python scripts/check_agent_workflow_yaml.py
          bash scripts/check_github_action_pins.sh
          uv run --no-project python scripts/check_agent_handoff.py
          git diff --check
          python3 - <<'PY'
          import subprocess

          actual = set(filter(None, subprocess.check_output(
              ['bash', '-lc', '{ git diff --name-only; git ls-files --others --exclude-standard; }'],
              text=True,
          ).splitlines()))
          allowed = {
              '.github/workflows/pr-fast-checks.yml',
              '.github/workflows/tests.yml',
              'AGENTS.md',
              'docs/REAL_WORLD_TESTING_PLAYBOOK.md',
              'tools/test_ci_lane_contract.py',
          }
          required_new = {
              '.github/workflows/tests.yml',
              'AGENTS.md',
              'docs/REAL_WORLD_TESTING_PLAYBOOK.md',
          }
          if not actual <= allowed:
              raise SystemExit(f'unexpected generated paths: {sorted(actual - allowed)}')
          if not required_new <= actual:
              raise SystemExit(f'missing generated paths: {sorted(required_new - actual)}')
          PY
      - name: Create validated blob identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/git'

          def post(path, payload):
              request = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          retained = (
              '.github/workflows/pr-fast-checks.yml',
              '.github/workflows/tests.yml',
              'AGENTS.md',
              'docs/REAL_WORLD_TESTING_PLAYBOOK.md',
              'tools/test_ci_lane_contract.py',
          )
          blob_shas = {}
          for path in retained:
              blob = post('/blobs', {
                  'content': Path(path).read_text(encoding='utf-8'),
                  'encoding': 'utf-8',
              })
              blob_shas[path] = blob['sha']
          payload = {
              'parent_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'base_tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'blob_shas': blob_shas,
              'removed_files': (
                  '.github/workflows/prepare-ci-main-docs-lane.yml',
                  '.github/ci/prepare_ci_main_docs_lane.py',
              ),
          }
          Path('/tmp/ci-blobs.json').write_text(json.dumps(payload, sort_keys=True), encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
      - name: Upload validated blob identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-main-docs-lane-blobs-${{ github.run_id }}
          path: /tmp/ci-blobs.json
          retention-days: 1
          if-no-files-found: error
