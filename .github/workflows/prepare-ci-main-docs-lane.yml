name: prepare-ci-main-docs-lane

on:
  push:
    branches: [agent/ci-main-docs-lane-guard-1]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: prepare-ci-main-docs-lane
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'push' || github.head_ref == 'agent/ci-main-docs-lane-guard-1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/ci-main-docs-lane-guard-1
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
      - name: Apply bounded CI optimization
        run: python3 .github/ci/prepare_ci_main_docs_lane.py
      - name: Validate generated result
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml python -m unittest tools.test_ci_workflow_optimization tools.test_ci_lane_contract -v
          uv run --no-project --with pyyaml python scripts/check_agent_workflow_yaml.py
          bash scripts/check_github_action_pins.sh
          uv run --no-project python scripts/check_agent_handoff.py
          git diff --check
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          expected=$'.github/workflows/pr-fast-checks.yml\n.github/workflows/tests.yml\nAGENTS.md\ndocs/REAL_WORLD_TESTING_PLAYBOOK.md\ntools/test_ci_lane_contract.py'
          test "${actual}" = "${expected}"
      - name: Package final files
        run: |
          set -euo pipefail
          out=/tmp/ci-main-docs-lane-final
          mkdir -p "$out/.github/workflows" "$out/tools" "$out/docs"
          cp .github/workflows/tests.yml "$out/.github/workflows/tests.yml"
          cp .github/workflows/pr-fast-checks.yml "$out/.github/workflows/pr-fast-checks.yml"
          cp tools/test_ci_lane_contract.py "$out/tools/test_ci_lane_contract.py"
          cp AGENTS.md "$out/AGENTS.md"
          cp docs/REAL_WORLD_TESTING_PLAYBOOK.md "$out/docs/REAL_WORLD_TESTING_PLAYBOOK.md"
          git diff --binary > "$out/final.patch"
      - name: Upload final files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-main-docs-lane-final-${{ github.run_id }}
          path: /tmp/ci-main-docs-lane-final/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
