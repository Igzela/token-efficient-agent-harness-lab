name: probe-postmerge-docs-lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/ci-main-docs-postmerge-probe-1'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact post-merge documentation lane
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 349b10c90a23f02fc01b740b9a55581fb15258bb
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({
              "event": "push",
              "branch": "main",
              "head_sha": target,
              "per_page": 10,
          })
          run = None
          for _ in range(120):
              data = get(f"https://api.github.com/repos/{repo}/actions/runs?{query}")
              matches = [
                  item for item in data.get("workflow_runs", [])
                  if item.get("head_sha") == target
                  and item.get("event") == "push"
                  and item.get("head_branch") == "main"
              ]
              if len(matches) > 1:
                  raise SystemExit(f"ambiguous exact push runs: {[item['id'] for item in matches]}")
              if matches:
                  run = matches[0]
                  if run.get("status") == "completed":
                      break
              time.sleep(10)
          if run is None:
              raise SystemExit("exact post-merge push run was not created")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit(
                  f"exact push run did not succeed: id={run.get('id')} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')}"
              )

          run_id = run["id"]
          jobs = get(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          ).get("jobs", [])
          by_name = {job["name"]: job for job in jobs}
          required = {
              "python-tests",
              "rust-tests",
              "pg-integration-tests",
              "typescript-tests",
              "native-runtime",
              "rust-typescript-cutover",
              "docker-build",
          }
          missing = sorted(required - by_name.keys())
          if missing:
              raise SystemExit(f"missing required source jobs: {missing}")

          heavy_steps = {
              "python-tests": "Check wire codegen drift",
              "rust-tests": "Run cargo test",
              "pg-integration-tests": "Start PostgreSQL service",
              "typescript-tests": "Set up Bun",
              "native-runtime": "Build native engine",
              "rust-typescript-cutover": "Verify Rust + TypeScript stack",
              "docker-build": "Build local Docker services",
          }
          job_evidence = {}
          for name in sorted(required):
              job = by_name[name]
              if job.get("conclusion") != "success":
                  raise SystemExit(f"required job {name} did not succeed")
              steps = {step["name"]: step for step in job.get("steps", [])}
              for expected in ("Verify exact requested head", "Report documentation-only lane"):
                  if steps.get(expected, {}).get("conclusion") != "success":
                      raise SystemExit(f"{name}: {expected} was not successful")
              heavy = heavy_steps[name]
              if steps.get(heavy, {}).get("conclusion") != "skipped":
                  raise SystemExit(f"{name}: heavy step {heavy} was not skipped")
              job_evidence[name] = {
                  "conclusion": job["conclusion"],
                  "docs_only_report": steps["Report documentation-only lane"]["conclusion"],
                  "heavy_step": heavy,
                  "heavy_step_conclusion": steps[heavy]["conclusion"],
              }

          capsule = by_name.get("context-capsule")
          if capsule is None or capsule.get("conclusion") != "success":
              raise SystemExit("terminal context-capsule job did not succeed")
          capsule_steps = {step["name"]: step for step in capsule.get("steps", [])}
          if capsule_steps.get("Validate source-check matrix is fully successful", {}).get("conclusion") != "success":
              raise SystemExit("terminal source-check matrix validation did not succeed")

          artifacts = get(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          ).get("artifacts", [])
          expected_prefix = f"context-capsule-{run_id}-1-{target}"
          capsule_artifacts = [
              artifact for artifact in artifacts
              if artifact.get("name") == expected_prefix and not artifact.get("expired")
          ]
          if len(capsule_artifacts) != 1:
              raise SystemExit(
                  f"expected one exact capsule artifact {expected_prefix}, got "
                  f"{[artifact.get('name') for artifact in artifacts]}"
              )

          started = dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          finished = dt.datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
          duration_seconds = int((finished - started).total_seconds())
          result = {
              "schema": "ci_main_docs_lane_acceptance.v1",
              "head_sha": target,
              "event": run["event"],
              "branch": run["head_branch"],
              "run_id": run_id,
              "run_number": run["run_number"],
              "status": run["status"],
              "conclusion": run["conclusion"],
              "created_at": run["created_at"],
              "updated_at": run["updated_at"],
              "duration_seconds": duration_seconds,
              "required_jobs": job_evidence,
              "context_capsule_job": capsule["conclusion"],
              "matrix_validation": capsule_steps[
                  "Validate source-check matrix is fully successful"
              ]["conclusion"],
              "artifact_id": capsule_artifacts[0]["id"],
              "artifact_name": capsule_artifacts[0]["name"],
              "artifact_digest": capsule_artifacts[0].get("digest"),
          }
          with open("/tmp/postmerge-docs-lane.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, sort_keys=True)
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Upload post-merge lane evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postmerge-docs-lane-349b10c9-${{ github.run_id }}
          path: /tmp/postmerge-docs-lane.json
          retention-days: 1
          if-no-files-found: error
