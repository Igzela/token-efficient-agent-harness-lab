name: pe3-clippy-diagnostic

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: clippy
      - name: Capture clippy failure
        run: |
          set +e
          cargo clippy -p engine --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo "clippy_exit=$?" >> clippy.log
          tail -n 200 clippy.log
      - name: Upload clippy diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pe3-clippy-diagnostic
          path: clippy.log
          retention-days: 1
