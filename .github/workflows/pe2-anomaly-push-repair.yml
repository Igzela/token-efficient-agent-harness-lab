name: pe2-anomaly-push-repair

on:
  push:
    branches:
      - agent/pe2-explainable-budget-anomalies
    paths:
      - ".github/pe2_anomaly_duplicate_ref_repair.py"
      - ".github/workflows/pe2-anomaly-push-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/pe2-explainable-budget-anomalies
          persist-credentials: true
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Apply and verify evidence-reference repair
        run: |
          python .github/pe2_anomaly_duplicate_ref_repair.py
          cargo fmt --all
          cargo test -p engine budget_anomaly::tests::conflicting_duplicates_fail_closed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/budget_anomaly.rs
          git commit -m "fix: deduplicate anomaly evidence references"
          git push origin HEAD:agent/pe2-explainable-budget-anomalies
