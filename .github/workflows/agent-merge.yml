name: agent-merge

env:
  INPUT_HEAD_SHA: ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-pr-state-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Recheck all exact-head merge requirements
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent-control/control_state.py require-auto-merge >/dev/null
          python3 scripts/agent-control/state_manager.py verify-merge "${{ inputs.pr_number }}" "${{ inputs.issue_number }}" "$INPUT_HEAD_SHA"
      - name: Recheck control immediately before expected-head GitHub merge API call
        id: merge_api
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-auto-merge >/dev/null
          RESULT=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${{ inputs.pr_number }}/merge" \
            -f sha="$INPUT_HEAD_SHA" -f merge_method=squash)
          test "$(jq -r '.merged' <<<"$RESULT")" = true
          echo "merge_sha=$(jq -er '.sha' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
      - name: Re-read merged PR and require durable merge confirmation
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr view "${{ inputs.pr_number }}" --json state,headRefOid,mergeCommit)
          test "$(jq -r '.state' <<<"$PR")" = MERGED
          test "$(jq -r '.headRefOid' <<<"$PR")" = "$INPUT_HEAD_SHA"
          MERGE_COMMIT=$(jq -er '.mergeCommit.oid' <<<"$PR")
          test -n "$MERGE_COMMIT"
          echo "merge_commit_sha=$MERGE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Recheck control before recording completion and closing Issue
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agent-control/control_state.py require-auto-merge >/dev/null
          python3 scripts/agent-control/state_manager.py record-merge "${{ inputs.issue_number }}" "${{ inputs.pr_number }}" \
            "$INPUT_HEAD_SHA" "${{ steps.confirm.outputs.merge_commit_sha }}"
          python3 scripts/agent-control/state_manager.py set-labels "${{ inputs.issue_number }}" agent-complete
          gh issue close "${{ inputs.issue_number }}"
      - name: Recheck control before dispatching one next dependency-ready task
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          python3 scripts/agent-control/dispatcher.py dispatch-next "${{ inputs.issue_number }}"

  failure-handler:
    needs: merge
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Preserve disabled, emergency, and stale merge states
        env:
          AGENT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 scripts/agent-control/control_state.py require-live >/dev/null; then exit 0; fi
          echo "merge failure leaves current Issue state unchanged for operator inspection"
