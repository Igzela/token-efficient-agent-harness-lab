name: agent-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to merge
        required: true
        type: number
      issue_number:
        description: Associated issue number
        required: true
        type: number
      head_sha:
        description: Expected exact PR head SHA
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-merge-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Check orchestrator gate
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Merge disabled."
            exit 0
          fi
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}

      - name: Verify merge conditions inline
        run: |
          python3 scripts/agent-control/state_manager.py verify-merge \
            ${{ github.event.inputs.pr_number }} \
            ${{ github.event.inputs.issue_number }} \
            ${{ github.event.inputs.head_sha }}

      - name: Mark agent-complete
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} agent-complete

      - name: Rebase and merge
        run: |
          gh pr merge ${{ github.event.inputs.pr_number }} --rebase --body \
            "## Agent Orchestrator: Merge
          Issue: #${{ github.event.inputs.issue_number }}
          Merged head: \`${{ github.event.inputs.head_sha }}\`
          Review and CI verification completed automatically."

      - name: Record merge state
        run: |
          python3 scripts/agent-control/state_manager.py record-merge \
            ${{ github.event.inputs.issue_number }} \
            ${{ github.event.inputs.pr_number }} \
            ${{ github.event.inputs.head_sha }}

      - name: Close issue
        run: |
          gh issue close ${{ github.event.inputs.issue_number }} \
            --comment "This issue was resolved automatically by the agent orchestrator."

      - name: Comment on issue
        run: |
          python3 scripts/agent-control/state_manager.py comment \
            ${{ github.event.inputs.issue_number }} \
            "## Agent Orchestrator: Merged
          PR: #${{ github.event.inputs.pr_number }}
          Merged head: \`${{ github.event.inputs.head_sha }}\`
          This issue has been resolved automatically."

  failure-handler:
    needs: merge
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Mark blocked on merge failure
        run: |
          python3 scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue_number }} agent-blocked
