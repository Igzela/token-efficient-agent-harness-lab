name: agent-merge

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-merge-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  AGENT_REPO: ${{ github.repository }}

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Verify head SHA
        run: |
          CURRENT=$(gh pr view ${{ inputs.pr_number }} --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT" != "${{ inputs.head_sha }}" ]; then
            echo "SHA mismatch: expected ${{ inputs.head_sha }}, got $CURRENT"
            exit 1
          fi

      - name: Verify PR is open
        run: |
          STATE=$(gh pr view ${{ inputs.pr_number }} --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR is $STATE, not OPEN"
            exit 1
          fi

      - name: Verify checks pass
        run: |
          CHECKS=$(gh pr view ${{ inputs.pr_number }} --json statusCheckRollup --jq \
            '[.statusCheckRollup[] | select(.conclusion != null) | {name: .context, conclusion: .conclusion}]')
          FAILED=$(echo "$CHECKS" | python3 -c "import sys,json; checks=json.load(sys.stdin); failed=[c for c in checks if c.get('conclusion')!='success']; [print(c['name']) for c in failed]")
          if [ -n "$FAILED" ]; then
            echo "Failed checks:"
            echo "$FAILED"
            exit 1
          fi

      - name: Merge
        run: |
          gh pr merge ${{ inputs.pr_number }} --merge --subject \
            "agent: merge #${{ inputs.issue_number }} implementation"

      - name: Mark agent-complete
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ inputs.issue_number }} agent-complete

      - name: Report merge failure
        if: failure()
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ inputs.issue_number }} agent-blocked
