name: pe3-doc-patch

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-doc-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Apply and commit document repair
        run: |
          python .github/pe3_doc_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATUS.md docs/NEXT_DECISION.md docs/ARCHITECTURE_BOOK.md docs/MODULE_MAP.md
          git commit -m "PE3-REPAIR-1 repair active docs and PE4 contract routing"
          git push origin HEAD:${{ github.head_ref }}
