name: agent-intake

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: agent-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch-ready:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Dispatch only a live dependency-ready Issue
        run: |
          set -euo pipefail
          if ! python3 scripts/agent-control/control_state.py require-live >/dev/null; then
            echo "disabled or emergency-stopped; no mutation"
            exit 0
          fi
          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "${{ github.event.issue.number }}")
          if ! echo "$LABELS" | grep -qw agent-ready; then
            echo "no-op: Issue is not agent-ready"
            exit 0
          fi
          if ! python3 scripts/agent-control/state_manager.py validate-scope "${{ github.event.issue.number }}"; then
            echo "no-op: Issue has no valid machine-readable scope; Vader was not invoked"
            python3 scripts/agent-control/state_manager.py record-dispatch \
              "${{ github.event.issue.number }}" \
              "intake:${{ github.event.delivery }}:${{ github.event.issue.number }}" \
              worker rejected '{"reason":"invalid_scope"}'
            exit 0
          fi
          if ! python3 scripts/agent-control/state_manager.py check-deps "${{ github.event.issue.number }}" >/dev/null; then
            echo "no-op: dependencies are not complete"
            exit 0
          fi
          python3 scripts/agent-control/control_state.py require-live >/dev/null
          gh workflow run agent-controller.yml --ref main \
            -f command=dispatch-ready \
            -f issue="${{ github.event.issue.number }}" \
            -f dispatch_id="intake:${{ github.event.delivery }}:${{ github.event.issue.number }}"
