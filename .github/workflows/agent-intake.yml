name: agent-intake

on:
  issues:
    types: [opened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to force-intake
        required: false
        type: number
      dry_run:
        description: Validate without side effects
        required: false
        default: false
        type: boolean

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: agent-intake
  cancel-in-progress: false

env:
  AGENT_REPO: ${{ github.repository }}
  AGENT_GH_CMD: gh

jobs:
  intake:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.action == 'opened' ||
        (github.event.action == 'labeled' &&
         (contains(github.event.label.name, 'agent-ready') ||
          contains(github.event.label.name, 'agent-draft')))))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set issue number
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ github.event.inputs.issue }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate labels
        id: labels
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py get-labels \
            ${{ steps.vars.outputs.issue }} > /tmp/agent-labels.txt
          echo "current_labels=$(cat /tmp/agent-labels.txt)" >> "$GITHUB_OUTPUT"

      - name: Handle agent-draft
        if: >
          contains(steps.labels.outputs.current_labels, 'agent-draft') &&
          !contains(steps.labels.outputs.current_labels, 'agent-ready')
        run: |
          ISSUE=${{ steps.vars.outputs.issue }}
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator Intake
          Task registered as **draft** (label: \`agent-draft\`).
          Change label to \`agent-ready\` when dependencies are resolved to start execution."

      - name: Check dependencies
        id: deps
        if: contains(steps.labels.outputs.current_labels, 'agent-ready')
        run: |
          if python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py check-deps \
            ${{ steps.vars.outputs.issue }}; then
            echo "status=ready" >> "$GITHUB_OUTPUT"
          else
            echo "status=blocked" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark ready for execution
        if: steps.deps.outputs.status == 'ready'
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py add-labels \
            ${{ steps.vars.outputs.issue }} agent-ready
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py remove-labels \
            ${{ steps.vars.outputs.issue }} agent-draft

      - name: Mark blocked on dependencies
        if: steps.deps.outputs.status == 'blocked'
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py add-labels \
            ${{ steps.vars.outputs.issue }} agent-blocked
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py comment \
            ${{ steps.vars.outputs.issue }} \
            "## Agent Orchestrator: Dependencies Not Met
          This task has unresolved dependencies and has been labeled \`agent-blocked\`.
          Ensure all prerequisite issues are labeled \`agent-complete\` before adding \`agent-ready\`."

      - name: Dry-run report
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "=== Dry-Run Intake Report ==="
          echo "Issue: ${{ steps.vars.outputs.issue }}"
          echo "Labels: ${{ steps.labels.outputs.current_labels }}"
