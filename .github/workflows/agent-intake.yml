name: agent-intake

on:
  issues:
    types: [opened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to force-intake
        required: false
        type: number
      dry_run:
        description: Validate without side effects
        required: false
        default: false
        type: boolean

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: agent-intake-${{ github.event.inputs.issue || github.event.issue.number || 'none' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      emergency_stopped: ${{ steps.check.outputs.emergency_stopped }}
      issue_number: ${{ steps.vars.outputs.issue }}
    steps:
      - name: Determine issue number
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ github.event.inputs.issue }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check orchestrator gate and emergency stop
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.Agent_EMERGENCY_STOP }}
        run: |
          ISSUE="${{ steps.vars.outputs.issue }}"
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "0" ]; then
            echo "No valid issue number. Skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Intake disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "Emergency stop is active. Intake disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "emergency_stopped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "emergency_stopped=false" >> "$GITHUB_OUTPUT"

  intake:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Validate labels and state
        id: labels
        run: |
          ISSUE=${{ needs.gate.outputs.issue_number }}
          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "$ISSUE")
          echo "current_labels=$LABELS" >> "$GITHUB_OUTPUT"

          if echo "$LABELS" | grep -qE "(agent-running|ci-repairing|review-running|agent-complete|agent-blocked)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Issue #$ISSUE is already active or terminal ($LABELS). Skipping intake."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Handle agent-draft
        if: >
          steps.labels.outputs.skip != 'true' &&
          contains(steps.labels.outputs.current_labels, 'agent-draft') &&
          !contains(steps.labels.outputs.current_labels, 'agent-ready')
        run: |
          ISSUE=${{ needs.gate.outputs.issue_number }}
          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator Intake
          Task registered as **draft** (\`agent-draft\`).
          Change label to \`agent-ready\` when dependencies are resolved to start execution."

      - name: Check dependencies
        id: deps
        if: >
          steps.labels.outputs.skip != 'true' &&
          contains(steps.labels.outputs.current_labels, 'agent-ready')
        run: |
          ISSUE=${{ needs.gate.outputs.issue_number }}
          if python3 scripts/agent-control/state_manager.py check-deps "$ISSUE"; then
            echo "status=ready" >> "$GITHUB_OUTPUT"
          else
            echo "status=blocked" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark ready and dispatch worker
        id: dispatch
        if: steps.deps.outputs.status == 'ready'
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
        run: |
          ISSUE=${{ needs.gate.outputs.issue_number }}
          python3 scripts/agent-control/state_manager.py add-labels "$ISSUE" agent-ready
          python3 scripts/agent-control/state_manager.py remove-labels "$ISSUE" agent-draft

          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "Orchestrator disabled. Issue labeled agent-ready but worker will not start."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Dispatching implementation worker for issue #$ISSUE"
          gh workflow run agent-worker.yml \
            --ref "${{ github.ref_name }}" \
            -f issue="$ISSUE" \
            -f dry_run=false
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Mark blocked on dependencies
        if: steps.deps.outputs.status == 'blocked'
        run: |
          ISSUE=${{ needs.gate.outputs.issue_number }}
          python3 scripts/agent-control/state_manager.py add-labels "$ISSUE" agent-blocked
          python3 scripts/agent-control/state_manager.py comment "$ISSUE" \
            "## Agent Orchestrator: Dependencies Not Met
          This task has unresolved dependencies and has been labeled \`agent-blocked\`.
          Resolve dependencies and add \`agent-ready\` to start execution."

      - name: Dry-run report
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "=== Dry-Run Intake Report ==="
          echo "Issue: ${{ needs.gate.outputs.issue_number }}"
          echo "Labels: ${{ steps.labels.outputs.current_labels }}"
          echo "Side effects would have been: update labels, post comments, dispatch worker"

  dry-run-report:
    needs: gate
    if: needs.gate.outputs.enabled == 'false' && github.event.inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report dry-run
        run: |
          echo "=== Dry-Run Intake Report ==="
          echo "Issue: ${{ needs.gate.outputs.issue_number }}"
          echo "Orchestrator disabled. No side effects performed."
