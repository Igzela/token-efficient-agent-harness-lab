name: agent-intake

on:
  issues:
    types: [opened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to inspect
        required: false
        type: number
      dry_run:
        description: Read-only validation plan
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-intake-${{ inputs.issue || github.event.issue.number || 'none' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      dry_run: ${{ steps.check.outputs.dry_run }}
      issue_number: ${{ steps.vars.outputs.issue }}
    steps:
      - name: Determine issue number and mode
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ inputs.issue }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check orchestrator gate
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
          AGENT_EMERGENCY_STOP: ${{ vars.AGENT_EMERGENCY_STOP }}
        run: |
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          ISSUE="${{ steps.vars.outputs.issue }}"
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "0" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Intake disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AGENT_EMERGENCY_STOP:-false}" = "true" ]; then
            echo "AGENT_EMERGENCY_STOP is true. Intake disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Build read-only dry-run plan
        run: |
          set -euo pipefail
          ISSUE="${{ needs.gate.outputs.issue_number }}"
          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "$ISSUE")
          DEPENDENCIES="ready"
          if ! python3 scripts/agent-control/state_manager.py check-deps "$ISSUE" >/dev/null; then
            DEPENDENCIES="blocked"
          fi
          python3 - "$ISSUE" "$LABELS" "$DEPENDENCIES" <<'PY'
          import json, sys
          print(json.dumps({
              "mode": "dry-run",
              "issue": int(sys.argv[1]),
              "labels": sys.argv[2].split(),
              "dependencies": sys.argv[3],
              "mutations": [],
              "dispatch": None,
              "codex": False,
              "worktree": False,
          }, sort_keys=True))
          PY

  live-intake:
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Inspect issue and dispatch serialized controller
        run: |
          set -euo pipefail
          ISSUE="${{ needs.gate.outputs.issue_number }}"
          LABELS=$(python3 scripts/agent-control/state_manager.py get-labels "$ISSUE")
          if echo "$LABELS" | grep -Eq "(agent-running|ci-repairing|review-running|agent-complete|agent-blocked)"; then
            echo "Issue #$ISSUE is already active or terminal; no dispatch."
            exit 0
          fi
          if ! echo "$LABELS" | grep -qw "agent-ready"; then
            echo "Issue #$ISSUE is not agent-ready; no dispatch."
            exit 0
          fi
          if ! python3 scripts/agent-control/state_manager.py check-deps "$ISSUE" >/dev/null; then
            echo "Issue #$ISSUE has unresolved dependencies; no dispatch."
            exit 0
          fi
          gh workflow run agent-controller.yml --ref main \
            -f command=dispatch-ready \
            -f issue="$ISSUE" \
            -f dispatch_id="worker:$ISSUE"
