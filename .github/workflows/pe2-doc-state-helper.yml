name: pe2-doc-state-helper

on:
  pull_request:
    paths:
      - "docs/NEXT_DECISION.md"
      - ".github/workflows/pe2-doc-state-helper.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Advance authoritative packet state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/NEXT_DECISION.md")
          text = path.read_text()
          replacements = {
              "| PE-2 | P0/P1 | Budget Intelligence and Anomaly Auto-Pause | Active; contract packet ready |": "| PE-2 | P0/P1 | Budget Intelligence and Anomaly Auto-Pause | Active; forecast packet ready |",
              "### Packet PE2-CONTRACT-1 — Budget intelligence evidence contract\n\n**State:** `READY_FOR_TERRA`": "### Packet PE2-CONTRACT-1 — Budget intelligence evidence contract\n\n**State:** `COMPLETE`",
              "### Packet PE2-FORECAST-1 — Deterministic budget forecasts\n\n**State:** `BLOCKED_PREREQUISITE`": "### Packet PE2-FORECAST-1 — Deterministic budget forecasts\n\n**State:** `READY_FOR_TERRA`",
              "1. Execute PE2-CONTRACT-1 from latest `main`.": "1. Execute PE2-FORECAST-1 from latest `main`.",
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"missing expected packet-state anchor: {before}")
              text = text.replace(before, after, 1)
          path.write_text(text)
          PY
          if git diff --quiet -- docs/NEXT_DECISION.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEXT_DECISION.md
          git commit -m "docs: advance PE-2 forecast packet"
          git push origin HEAD:${{ github.head_ref }}
