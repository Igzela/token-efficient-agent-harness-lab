name: pe3-rustfmt-patch

on:
  push:
    branches:
      - codex/pe3-independent-repair

permissions:
  contents: read

jobs:
  rustfmt-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
        with:
          components: rustfmt
      - name: Generate rustfmt patch
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
          test -s rustfmt.patch
      - name: Upload rustfmt patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pe3-rustfmt-patch
          path: rustfmt.patch
          retention-days: 1
