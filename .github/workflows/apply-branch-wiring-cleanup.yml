name: apply branch wiring cleanup

on:
  push:
    branches:
      - agent/fix-wiring-audit-notes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-wiring-audit-notes
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply wiring cleanup patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          dispatch = Path('engine/src/dispatch_engine.rs')
          text = dispatch.read_text()
          old = 'reason: "sandbox execution disabled in Phase 1".to_string(),'
          new = 'reason: "process/container/VM sandbox isolation is not implemented for this local runtime boundary".to_string(),'
          if old not in text:
              raise SystemExit('stale sandbox wording target not found')
          dispatch.write_text(text.replace(old, new))

          main = Path('engine/src/main.rs')
          text = main.read_text()

          new_state_builder = r'''fn build_state_with_provider(
              state: AxumApiState,
              store: &Arc<LocalProductStore>,
              cb_registry: &Arc<CircuitBreakerRegistry>,
          ) -> AxumApiState {
              let provider_type = match std::env::var("ACP_PROVIDER_TYPE") {
                  Ok(v) if !v.trim().is_empty() => v.trim().to_string(),
                  _ => return state,
              };

              let enable_execution = single_provider_execution_enabled();
              if provider_type != "stub" && !enable_execution {
                  eprintln!(
                      "ACP_PROVIDER_TYPE={} requires ACP_ENABLE_PROVIDER_EXECUTION=1 or a ready ACP_TRUSTED_LOCAL_PROFILE=1; falling back to noop",
                      provider_type
                  );
                  return state;
              }

              let provider = match build_single_provider_from_env(cb_registry) {
                  Ok(provider) => provider,
                  Err(error) => {
                      eprintln!("{error}; falling back to noop");
                      return state;
                  }
              };
              let recorder = Arc::new(ProviderAuditRecorder::with_store(store.clone()));
              state.with_provider_and_audit(provider, recorder)
          }
          '''

          text, count = re.subn(
              r"fn build_state_with_provider\([\s\S]*?\nfn build_adaptive_provider_executor_from_sources\(",
              new_state_builder + "\nfn build_adaptive_provider_executor_from_sources(",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('build_state_with_provider replacement failed')

          new_provider_builder = r'''fn build_single_provider_from_env(
              cb_registry: &Arc<CircuitBreakerRegistry>,
          ) -> Result<Arc<dyn Provider>, String> {
              let provider_type = std::env::var("ACP_PROVIDER_TYPE")
                  .map_err(|_| "ACP_PROVIDER_TYPE not set".to_string())?;
              let provider_type = provider_type.trim();
              if provider_type.is_empty() {
                  return Err("ACP_PROVIDER_TYPE is empty".to_string());
              }

              if provider_type == "stub" {
                  return Ok(Arc::new(StubProvider::new("stub-env")));
              }

              let api_key_env = std::env::var("ACP_API_KEY").unwrap_or_default();
              let model = provider_model_from_env();
              let base_url = std::env::var("ACP_BASE_URL").unwrap_or_default();
              let pricing = provider_pricing_from_env();
              if !pricing.configured() {
                  eprintln!(
                      "provider token usage will be tracked, but ACP_PROVIDER_INPUT_COST_PER_1K_USD/ACP_PROVIDER_OUTPUT_COST_PER_1K_USD are not fully configured"
                  );
              }

              let boundary = CredentialBoundary::new("env").expect("env credential backend");
              let cred_ref = CredentialRef::new(
                  &api_key_env,
                  "env",
                  "***",
                  "provider:auto",
                  "2026-01-01T00:00:00Z",
              );

              let base_provider: Arc<dyn Provider> = match provider_type {
                  "openai_compatible" => {
                      let mut config = ProviderConfig::new(
                          "openai-env",
                          "openai_compatible",
                          &base_url,
                          &model,
                          &api_key_env,
                          "2026-01-01T00:00:00Z",
                      );
                      config.apply_pricing(&pricing);
                      Arc::new(OpenAiProvider::new(
                          config,
                          boundary,
                          cred_ref,
                          Arc::new(ReqwestTransport::new()),
                          None,
                      ))
                  }
                  "anthropic" => {
                      let mut config = ProviderConfig::new(
                          "anthropic-env",
                          "anthropic",
                          &base_url,
                          &model,
                          &api_key_env,
                          "2026-01-01T00:00:00Z",
                      );
                      config.apply_pricing(&pricing);
                      Arc::new(AnthropicProvider::new(
                          config,
                          boundary,
                          cred_ref,
                          Arc::new(ReqwestTransport::new()),
                          None,
                      ))
                  }
                  other => return Err(format!("unknown ACP_PROVIDER_TYPE: {other}")),
              };

              let cb_threshold = std::env::var("ACP_CIRCUIT_BREAKER_THRESHOLD")
                  .ok()
                  .and_then(|v| v.parse::<u64>().ok())
                  .unwrap_or(5);
              let cb_recovery_ms = std::env::var("ACP_CIRCUIT_BREAKER_RECOVERY_MS")
                  .ok()
                  .and_then(|v| v.parse::<u64>().ok())
                  .unwrap_or(30_000);
              let provider_cb = Arc::new(CircuitBreaker::new(
                  format!("provider:{}", base_provider.provider_id()),
                  cb_threshold,
                  cb_recovery_ms,
              ));
              cb_registry.register(provider_cb.clone());
              Ok(Arc::new(CircuitBreakerProvider::new(
                  base_provider,
                  provider_cb,
              )))
          }

          /// Build a provider Arc for engine injection (separate from the API state provider).
          /// Returns `Err` if ACP_PROVIDER_TYPE is unset or provider execution is not enabled.
          fn build_provider_for_engine(
              _store: &Arc<LocalProductStore>,
              cb_registry: &Arc<CircuitBreakerRegistry>,
          ) -> Result<Arc<dyn Provider>, String> {
              if !single_provider_execution_enabled() {
                  return Err(
                      "provider execution not enabled by ACP_ENABLE_PROVIDER_EXECUTION or ready ACP_TRUSTED_LOCAL_PROFILE"
                          .to_string(),
                  );
              }
              build_single_provider_from_env(cb_registry)
          }
          '''

          text, count = re.subn(
              r"/// Build a provider Arc for engine injection[\s\S]*?\n/// Build a HashMap of CLI executors for HybridExecutor construction\.",
              new_provider_builder + "\n\n/// Build a HashMap of CLI executors for HybridExecutor construction.",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('provider builder replacement failed')

          main.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-branch-wiring-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/dispatch_engine.rs engine/src/main.rs .github/workflows/apply-branch-wiring-cleanup.yml
          git commit -m "Clean up provider builder wiring" || exit 0
          git push origin HEAD:agent/fix-wiring-audit-notes
