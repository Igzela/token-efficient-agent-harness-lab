name: pe2-anomaly-repair-helper

on:
  pull_request:
    paths:
      - ".github/pe2_anomaly_repair.py"
      - ".github/workflows/pe2-anomaly-repair-helper.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Update active PE-2 documents
        run: |
          python .github/pe2_anomaly_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATUS.md docs/NEXT_DECISION.md
          git commit -m "docs: advance PE-2 routing to read surfaces"
          git push origin HEAD:${{ github.head_ref }}
