name: pe2-anomaly-repair-helper

on:
  pull_request:
    paths:
      - ".github/pe2_anomaly_repair.py"
      - ".github/workflows/pe2-anomaly-repair-helper.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
      - name: Repair and commit branch-only anomaly contract
        run: |
          python .github/pe2_anomaly_repair.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/budget_anomaly.rs
          git commit -m "fix: preserve anomaly evidence coverage"
          git push origin HEAD:${{ github.head_ref }}
