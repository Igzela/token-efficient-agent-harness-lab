name: agent-controller

on:
  workflow_dispatch:
    inputs:
      command:
        description: Command to execute (select-task | next-task | retry-task | block-task | status | emergency-stop)
        required: true
        type: choice
        options:
          - select-task
          - next-task
          - retry-task
          - block-task
          - status
          - emergency-stop
      issue:
        description: Issue number (required for select-task, retry-task, block-task)
        required: false
        type: number
      reason:
        description: Reason (required for block-task)
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-controller
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check orchestrator gate
        id: check
        env:
          AGENT_ORCHESTRATOR_ENABLED: ${{ vars.AGENT_ORCHESTRATOR_ENABLED }}
        run: |
          if [ "${AGENT_ORCHESTRATOR_ENABLED:-false}" != "true" ]; then
            echo "AGENT_ORCHESTRATOR_ENABLED is not true. Controller disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  control:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Execute controller command
        id: command
        run: |
          COMMAND=${{ github.event.inputs.command }}

          case "$COMMAND" in
            select-task)
              python3 scripts/agent-control/state_manager.py select-task \
                ${{ github.event.inputs.issue }}
              echo "Dispatching worker for issue #${{ github.event.inputs.issue }}"
              gh workflow run agent-worker.yml \
                --ref main \
                -f issue="${{ github.event.inputs.issue }}" \
                -f dry_run=false
              ;;
            next-task)
              ISSUE=$(python3 scripts/agent-control/state_manager.py next-task)
              echo "selected_issue=$ISSUE" >> "$GITHUB_OUTPUT"
              if [ -n "$ISSUE" ] && [ "$ISSUE" != "None" ]; then
                echo "Dispatching worker for issue #$ISSUE"
                gh workflow run agent-worker.yml \
                  --ref main \
                  -f issue="$ISSUE" \
                  -f dry_run=false
              fi
              ;;
            retry-task)
              python3 scripts/agent-control/state_manager.py retry-task \
                ${{ github.event.inputs.issue }}
              echo "Dispatching worker for retry of issue #${{ github.event.inputs.issue }}"
              gh workflow run agent-worker.yml \
                --ref main \
                -f issue="${{ github.event.inputs.issue }}" \
                -f dry_run=false
              ;;
            block-task)
              python3 scripts/agent-control/state_manager.py block-task \
                ${{ github.event.inputs.issue }} \
                "${{ github.event.inputs.reason }}"
              ;;
            status)
              python3 scripts/agent-control/state_manager.py status
              ;;
            emergency-stop)
              echo "To activate emergency stop, set the AGENT_EMERGENCY_STOP"
              echo "repository variable to 'true' via GitHub UI or API."
              python3 scripts/agent-control/state_manager.py emergency-stop
              ;;
          esac

      - name: Report result
        run: |
          ISSUE="${{ steps.command.outputs.selected_issue }}"
          if [ -n "$ISSUE" ] && [ "$ISSUE" != "None" ]; then
            echo "Dispatched agent-worker for issue #$ISSUE"
          fi
