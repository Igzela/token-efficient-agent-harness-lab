name: agent-controller

on:
  workflow_dispatch:
    inputs:
      command:
        description: Control command
        required: true
        type: choice
        options:
          - dry-run
          - emergency-stop
          - emergency-resume
          - cleanup
          - cleanup-stale
          - next-task
          - force-start
          - force-block
          - force-complete
      issue:
        description: Issue number (required for force-* and next-task)
        required: false
        type: number

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

env:
  AGENT_REPO: ${{ github.repository }}
  AGENT_GH_CMD: gh
  AGENT_WORKTREE_BASE: /tmp/agent-worktrees

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"

      - name: Dry-run
        if: github.event.inputs.command == 'dry-run'
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/dry_run.py

      - name: Emergency stop
        if: github.event.inputs.command == 'emergency-stop'
        run: |
          for run in $(gh run list --workflow agent-worker --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            gh run cancel "$run" 2>/dev/null || true
          done
          for run in $(gh run list --workflow agent-ci-repair --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            gh run cancel "$run" 2>/dev/null || true
          done
          for run in $(gh run list --workflow agent-review --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            gh run cancel "$run" 2>/dev/null || true
          done
          for issue in $(python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py active-workers); do
            python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels "$issue" agent-blocked
          done
          echo "Emergency stop completed."

      - name: Emergency resume
        if: github.event.inputs.command == 'emergency-resume' && github.event.inputs.issue != ''
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-ready
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py remove-labels \
            ${{ github.event.inputs.issue }} agent-blocked

      - name: Cleanup
        if: github.event.inputs.command == 'cleanup'
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/cleanup.py

      - name: Cleanup stale worktrees
        if: github.event.inputs.command == 'cleanup-stale'
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/cleanup.py

      - name: Force start
        if: github.event.inputs.command == 'force-start' && github.event.inputs.issue != ''
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-ready

      - name: Force block
        if: github.event.inputs.command == 'force-block' && github.event.inputs.issue != ''
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-blocked

      - name: Force complete
        if: github.event.inputs.command == 'force-complete' && github.event.inputs.issue != ''
        run: |
          python3 ${{ github.workspace }}/scripts/agent-control/state_manager.py set-labels \
            ${{ github.event.inputs.issue }} agent-complete

      - name: Next task
        if: github.event.inputs.command == 'next-task'
        run: |
          gh issue list --label agent-ready --state open --json number,title --jq '.[] | "#\(.number): \(.title)"'
