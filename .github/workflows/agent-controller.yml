name: agent-controller

on:
  workflow_dispatch:
    inputs:
      command:
        required: true
        type: choice
        options:
          - setup-controls
          - status
          - enable-orchestrator
          - disable-orchestrator
          - enable-auto-merge
          - disable-auto-merge
          - emergency-stop
          - emergency-resume
          - dispatch-ready
          - dispatch-repair
          - dispatch-review
          - dispatch-merge
          - dispatch-next
          - retry-review
          - claim-local
          - handoff-local
          - release-local
          - block-local
          - claim-plan
          - handoff-plan
          - lifecycle-plan
          - promote-plan
          - record-route-t3-receipt
          - release-plan
          - block-plan
      issue:
        required: false
        type: number
      pr_number:
        required: false
        type: number
      head_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: number
      repair_count:
        required: false
        type: number
      source_issue:
        required: false
        type: number
      dispatch_id:
        required: false
        type: string
      attempt_id:
        required: false
        type: string
      client_token:
        required: false
        type: string
      claim_nonce:
        required: false
        type: string
      reason_code:
        required: false
        type: string
      packet_id:
        required: false
        type: string
      source_main_sha:
        required: false
        type: string
      stage:
        required: false
        type: string
      accepted_main_sha:
        required: false
        type: string
      candidate_digest:
        required: false
        type: string
      action_digest:
        required: false
        type: string
      scope_digest:
        required: false
        type: string
      authority_receipt_digest:
        required: false
        type: string
      outcome_receipt_digest:
        required: false
        type: string
      authority_owner_digest:
        required: false
        type: string
      decision_source:
        required: false
        type: string
      decision_digest:
        required: false
        type: string
      issued_at:
        required: false
        type: string
      expires_at:
        required: false
        type: string
      disposition:
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-dispatch-global
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      AGENT_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_DISPATCH_ID: ${{ inputs.dispatch_id }}
      INPUT_HEAD_SHA: ${{ inputs.head_sha }}
      INPUT_ATTEMPT_ID: ${{ inputs.attempt_id }}
      INPUT_CLIENT_TOKEN: ${{ inputs.client_token }}
      INPUT_CLAIM_NONCE: ${{ inputs.claim_nonce }}
      INPUT_REASON_CODE: ${{ inputs.reason_code }}
      INPUT_PACKET_ID: ${{ inputs.packet_id }}
      INPUT_SOURCE_MAIN_SHA: ${{ inputs.source_main_sha }}
      INPUT_STAGE: ${{ inputs.stage }}
      INPUT_ACCEPTED_MAIN_SHA: ${{ inputs.accepted_main_sha }}
      INPUT_CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
      INPUT_ACTION_DIGEST: ${{ inputs.action_digest }}
      INPUT_SCOPE_DIGEST: ${{ inputs.scope_digest }}
      INPUT_AUTHORITY_RECEIPT_DIGEST: ${{ inputs.authority_receipt_digest }}
      INPUT_OUTCOME_RECEIPT_DIGEST: ${{ inputs.outcome_receipt_digest }}
      INPUT_AUTHORITY_OWNER_DIGEST: ${{ inputs.authority_owner_digest }}
      INPUT_DECISION_SOURCE: ${{ inputs.decision_source }}
      INPUT_DECISION_DIGEST: ${{ inputs.decision_digest }}
      INPUT_ISSUED_AT: ${{ inputs.issued_at }}
      INPUT_EXPIRES_AT: ${{ inputs.expires_at }}
      INPUT_DISPOSITION: ${{ inputs.disposition }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.11"
      - name: Execute gated controller command
        run: |
          set -euo pipefail
          case "$INPUT_COMMAND" in
            setup-controls)
              # The compatibility CLI delegates to the single complete setup owner.
              python3 scripts/agent-control/control_state.py setup-controls
              ;;
            status|enable-orchestrator|disable-orchestrator|enable-auto-merge|disable-auto-merge|emergency-stop|emergency-resume)
              python3 scripts/agent-control/control_state.py "$INPUT_COMMAND"
              ;;
            retry-review)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py retry-review "${{ inputs.issue }}"
              ;;
            dispatch-ready)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py dispatch-ready "${{ inputs.issue }}" "$INPUT_DISPATCH_ID"
              ;;
            dispatch-repair)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py dispatch-repair "${{ inputs.pr_number }}" "${{ inputs.issue }}" \
                "$INPUT_HEAD_SHA" "${{ inputs.ci_run_id }}" "${{ inputs.repair_count }}"
              ;;
            dispatch-review)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py dispatch-review "${{ inputs.pr_number }}" "${{ inputs.issue }}" "$INPUT_HEAD_SHA"
              ;;
            dispatch-merge)
              python3 scripts/agent-control/control_state.py require-auto-merge >/dev/null
              python3 scripts/agent-control/dispatcher.py dispatch-merge "${{ inputs.pr_number }}" "${{ inputs.issue }}" "$INPUT_HEAD_SHA"
              ;;
            dispatch-next)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py dispatch-next "${{ inputs.source_issue }}"
              ;;
            claim-local)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py claim-local "${{ inputs.issue }}" \
                "$INPUT_ATTEMPT_ID" "$INPUT_CLIENT_TOKEN"
              ;;
            handoff-local)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py handoff-local "${{ inputs.issue }}" \
                "$INPUT_ATTEMPT_ID" "$INPUT_CLIENT_TOKEN" "$INPUT_HEAD_SHA" "$INPUT_CLAIM_NONCE"
              ;;
            release-local)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py release-local "${{ inputs.issue }}" \
                "$INPUT_ATTEMPT_ID" "$INPUT_CLIENT_TOKEN" "$INPUT_REASON_CODE" "$INPUT_CLAIM_NONCE"
              ;;
            block-local)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py block-local "${{ inputs.issue }}" \
                "$INPUT_ATTEMPT_ID" "$INPUT_CLIENT_TOKEN" "$INPUT_REASON_CODE" "$INPUT_CLAIM_NONCE"
              ;;
            claim-plan)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py claim-plan \
                "$INPUT_PACKET_ID" "$INPUT_ATTEMPT_ID"
              ;;
            handoff-plan)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py handoff-plan \
                "$INPUT_PACKET_ID" "$INPUT_ATTEMPT_ID" "$INPUT_HEAD_SHA" "$INPUT_CLAIM_NONCE"
              ;;
            lifecycle-plan)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py lifecycle-plan \
                "$INPUT_PACKET_ID" "$INPUT_ATTEMPT_ID" "$INPUT_STAGE"
              ;;
            promote-plan)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py promote-plan \
                "$INPUT_PACKET_ID" "$INPUT_ATTEMPT_ID"
              ;;
            record-route-t3-receipt)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py record-route-t3-receipt \
                "$INPUT_PACKET_ID" "$INPUT_ACCEPTED_MAIN_SHA" "$INPUT_CANDIDATE_DIGEST" \
                "$INPUT_ACTION_DIGEST" "$INPUT_SCOPE_DIGEST" "$INPUT_AUTHORITY_RECEIPT_DIGEST" \
                "$INPUT_OUTCOME_RECEIPT_DIGEST" "$INPUT_AUTHORITY_OWNER_DIGEST" "$GITHUB_ACTOR" \
                "$INPUT_DECISION_SOURCE" "$INPUT_DECISION_DIGEST" "$INPUT_ISSUED_AT" \
                "$INPUT_EXPIRES_AT" "$INPUT_DISPOSITION"
              ;;
            release-plan)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py release-plan \
                "$INPUT_PACKET_ID" "$INPUT_ATTEMPT_ID" "$INPUT_SOURCE_MAIN_SHA" \
                "$INPUT_REASON_CODE" "$INPUT_CLAIM_NONCE"
              ;;
            block-plan)
              python3 scripts/agent-control/control_state.py require-live >/dev/null
              python3 scripts/agent-control/dispatcher.py block-plan \
                "$INPUT_PACKET_ID" "$INPUT_ATTEMPT_ID" "$INPUT_SOURCE_MAIN_SHA" "$INPUT_CLAIM_NONCE"
              ;;
            *) echo "unknown command" >&2; exit 2 ;;
          esac
