services:
  engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile.engine
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - ENGINE_API_URL=http://engine:8080
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      engine:
        condition: service_healthy
