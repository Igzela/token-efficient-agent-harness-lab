[project]
name = "acp-opencode-adapter"
version = "0.1.0"
description = "Fixture-first OpenCode external coding adapter for ACP"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
acp-opencode-adapter = "acp_opencode_adapter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
