[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Local deterministic harness and macro-orchestrator control plane for studying agent workflows"
license = "MIT"
repository = "https://github.com/Igzela/token-efficient-agent-harness-lab"
readme = "../README.md"
keywords = ["agent", "workflow", "control-plane", "deterministic", "local"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "agent-control-plane"
path = "src/main.rs"

[[bin]]
name = "import-native-scorecard-artifacts"
path = "src/bin/import_native_scorecard_artifacts.rs"

[[bin]]
name = "local-runner-exec"
path = "src/bin/local_runner_exec.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
axum = "0.7"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
async-trait = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
libc = "0.2"
tracing-subscriber = "0.3"
postgres = { version = "0.19", optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }

[features]
pg = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres"]
pg-tests = ["pg"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
